        messages:
          type: "array"
          description: "包含到目前为止的会话消息集合，取决于模型，支持不同的消息类型（模态）如文本，图像和音频。用于生成连贯的对话响应"
          items:
            oneOf:
            - $ref: "#/components/schemas/ChatCompletionDeveloperMessageParam"
            - $ref: "#/components/schemas/ChatCompletionSystemMessageParam"
            - $ref: "#/components/schemas/ChatCompletionUserMessageParam"
            - $ref: "#/components/schemas/ChatCompletionAssistantMessageParam"
            - $ref: "#/components/schemas/ChatCompletionToolMessageParam"
            - $ref: "#/components/schemas/ChatCompletionFunctionMessageParam"
        lora_repo_info:
          type: "object"
          nullable: true
          description: "LoRA Git 仓库信息。用于临时挂载 LoRA 适配器。"
          additionalProperties: true
        lora_weights:
          type: "array"
          nullable: true
          description: "LoRA 适配器列表。每项可通过 lora_url 指定权重地址，或通过 lora_repo_info 指定 Git\
            \ 仓库信息。"
          items:
            type: "object"
            additionalProperties: true
        stream:
          type: "boolean"
          description: "是否启用流式输出，默认为 true。启用**流式响应传输**，使模型生成的回复内容**以增量形式**（逐 token\
            \ 或逐数据块）**实时推送至客户端**，而非等待完整回复生成后一次性传输"
          default: true
        max_tokens:
          type: "integer"
          description: "最大生成长度，用于指定模型生成的回复内容（completion）允许的最大 token 数量"
          default: 0
          nullable: true
        frequency_penalty:
          type: "number"
          description: "频率惩罚(重复内容抑制系数)，介于-2.0和2.0之间的数字，根据新标记在文本中的现有频率对新标记进行惩罚，以此减少\
            生成文本中重复内容的可能性"
          default: 0.0
          nullable: true
        presence_penalty:
          type: "number"
          description: "在场惩罚(新主题拓展系数)，介于-2.0和2.0之间的数字。根据新标记是否出现在文本中来惩罚它们，从而增加模型讨论新\
            主题的可能性"
          default: 0.0
          nullable: true
        stop:
          description: "停止词，默认为 null 可以是一个字符串或字符串数组，用于指定生成终止的触发条件，即当模型生成的内容中出现预设的停\
            止序列（字符串或字符串数组）时，立即终止生成过程。返回的结果不包含这些停止序列，确保输出内容在遇到终止条件时精确截断"
          default: null
        temperature:
          type: "number"
          description: "用于调整生成概率分布熵（Entropy）的参数，通过对模型输出的 logits（未归一化对数概率）进行温度缩放来控制\
            输出的随机性:较高的值（如 0.8）将使输出更随机，而较低的值（如 0.2）将使其更集中和确定性"
          default: 1.0
          nullable: true
        top_p:
          type: "number"
          description: "核采样(Nucleus Sampling） 是一种概率质量截断策略，用于限定模型生成时考虑的 token 集合，默认\
            为 1.0。具体而言，模型按概率降序排列所有 token，累加其概率直至达到 top_p（如 0.9 表示前 90% 概率质量的 token\
            \ 集合），仅从该集合中采样下一个 token"
          default: 1.0
          nullable: true
        top_logprobs:
          type: "integer"
          description: "用于指定模型在生成每个 token 时，返回概率最高的前 N 个 token 及其对数概率（log probability）\
            。这一功能基于模型的概率输出（需启用 logprobs=true），通过对每个 token 位置的概率分布进行 top-N 筛选，提供生成过\
            程的可解释性数据"
          default: 0
          nullable: true
        response_format:
          type: "object"
          description: "响应格式，用于定义模型输出的**结构化格式规则**。若提供**JSON Schema 或类似的格式描述对象**，模型\
            将严格遵循该规则生成响应；若为 null，则采用默认格式（通常为无结构化约束的纯文本）。用于确保生成结果与下游系统的输入格式完全匹配，避免格\
            式不兼容问题，提升数据流转的效率和准确性"
          nullable: true
        seed:
          type: "integer"
          description: "作为随机数生成器的初始化种子，控制模型生成过程中伪随机采样的确定性。当 seed 与其他生成参数（如 temperature、\
            top_p 等）固定时，理论上模型应生成相同的回复序列（假设后端无变化）"
          default: 0
          nullable: true
        "n":
          type: "integer"
          description: "决定模型为同一输入生成的并行回复选项数量（如 n=3 时，输出 3 条不同的回复）。这些选项基于模型的概率分布独立采\
            样（遵循指定的温度、top-p 等采样参数）"
          default: 1
          nullable: true
        logit_bias:
          type: "object"
          nullable: true
          description: "对数几率偏差，是大语言模型（LLM）中用于调整生成概率分布的高级控制参数。通过对特定 token 的 logits（\
            未归一化的预测分数）施加偏移量（bias），可以直接干预模型的生成倾向，实现对特定词汇、短语或内容的增强或抑制"
          additionalProperties:
            type: "number"
            format: "double"
            minimum: -100.0
            maximum: 100.0
          example:
            "1000": 99.9
            "1001": -99.9
        user:
          type: "string"
          description: "唯一标识发送请求的最终用户"
          nullable: true
        tools:
          description: "模型可调用的工具列表，支持函数工具和自定义文本或语法工具。"
          type: "array"
          items:
            $ref: "#/components/schemas/ChatCompletionToolsParam"
        guided_json:
          anyOf:
          - type: "string"
            nullable: true
          - type: "object"
            nullable: true
          - $ref: "#/components/schemas/BaseModel"
          description: "用于指定输出的 JSON 结构约束。若提供有效的 JSON 模式字符串，模型生成的结果将严格遵循该模式；若为null，\
            则不启用 JSON 结构约束"
        guided_choice:
          anyOf:
          - items:
              type: "string"
              nullable: true
            type: "array"
          title: "Guided Choice"
          description: "用于限制生成结果的取值范围。模型必须从该数组中精确匹配一个选项作为输出（即结果与某一GuidedChoice完全一致\
            ，包括内容和格式）"
    SystemOneRequestBody:
      type: "object"
      description: "System One 请求参数，由待判定的状态与问题集合构成"
      required:
      - "model"
      - "state"
      - "questions"
      additionalProperties: true
      properties:
        model:
          type: "string"
          minLength: 1
