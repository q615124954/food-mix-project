  /web-search-v2:
    post:
      description: "新版本搜索接口，请求仅需 content，响应使用新版原生格式。"
      tags:
      - "搜索"
      security:
      - AccessTokenAuth: []
      - AppAccessTokenAuth: []
      operationId: "serverless-api.web_search_v2"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                content:
                  type: "string"
                  description: "搜索查询内容"
                  example: "开源马越"
                search_recency_filter:
                  type: "string"
                  description: "根据网页发布时间进行筛选"
                  enum:
                  - "week"
                  - "month"
                  - "semiyear"
                  - "year"
                  example: "week"
                search_site_filter:
                  type: "array"
                  description: "指定站点搜索条件，仅在设置的站点中进行内容搜索；内部会转换为百度 search_filter.match.site。\
                    当前最多支持 100 个站点。"
                  items:
                    type: "string"
                  example:
                  - "tieba.baidu.com"
                  - "baike.baidu.com"
              required:
              - "content"
      responses:
        "200":
          description: "新版搜索原生响应"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  request_id:
                    type: "string"
                    description: "请求 ID"
                    example: "02087640-0669-454f-91ec-b9cab386b092"
                  references:
                    type: "array"
                    description: "搜索引用结果列表"
                    items:
                      type: "object"
                      properties:
                        id:
                          type: "integer"
                          description: "结果序号"
                          example: 1
                        url:
                          type: "string"
                          description: "结果链接"
                          example: "https://example.com/article"
                        title:
                          type: "string"
                          description: "结果标题"
                          example: "搜索结果标题"
                        date:
                          type: "string"
                          description: "发布时间"
                          example: "2026-05-05 00:00:00"
                        content:
                          type: "string"
                          description: "正文摘要内容"
                        icon:
                          type: "string"
                          description: "站点图标"
                        web_anchor:
                          type: "string"
                          description: "展示锚文本"
                        type:
                          type: "string"
                          description: "结果类型，例如 web、image、video"
                          example: "web"
                        website:
                          type: "string"
                          description: "站点名称"
                        video:
                          type: "object"
                          nullable: true
                          description: "视频扩展信息"
                          additionalProperties: true
                        image:
                          type: "object"
                          nullable: true
                          description: "图片扩展信息"
                          additionalProperties: true
                        is_aladdin:
                          type: "boolean"
                          description: "是否为结构化卡片结果"
                        aladdin:
                          type: "object"
                          nullable: true
                          description: "结构化卡片扩展信息"
                          additionalProperties: true
                        snippet:
                          type: "string"
                          description: "结果摘要片段"
                        web_extensions:
                          type: "object"
                          nullable: true
                          description: "网页扩展信息"
                          additionalProperties: true
                        rerank_score:
                          type: "number"
                          description: "排序相关性分数"
                        authority_score:
                          type: "number"
                          description: "权威性分数"
                        markdown_text:
                          type: "string"
                          description: "Markdown 格式正文"
                required:
                - "request_id"
                - "references"
  /web-search/custom:
    post:
      description: "火山引擎豆包搜索 Custom 版。\n使用平台 Web 搜索格式，支持站点、时效、权威度和行业过滤。\n"
      tags:
      - "搜索"
      security:
      - AccessTokenAuth: []
      - AppAccessTokenAuth: []
      operationId: "serverless-api.web_search_custom"
      requestBody:
        required: true
        description: "请求参数"
        content:
          application/json:
            schema:
              type: "object"
              properties:
                query:
                  type: "string"
                  maxLength: 100
                  description: "搜索关键字或语句，最多 100 个字符"
                  example: "阿里巴巴2024年的ESG报告"
                summary:
                  type: "boolean"
                  description: "是否在搜索结果中包含摘要"
                  example: true
                freshness:
                  type: "string"
                  description: "搜索时效范围；推荐使用 search_recency_filter"
                  default: "noLimit"
                  enum:
                  - "noLimit"
                  - "oneDay"
                  - "oneWeek"
                  - "oneMonth"
                  - "oneYear"
                search_recency_filter:
                  type: "string"
                  description: "根据网页发布时间进行筛选"
                  enum:
                  - "day"
                  - "week"
                  - "month"
                  - "semiyear"
                  - "year"
                  example: "week"
                search_site_filter:
                  type: "array"
                  maxItems: 20
                  description: "指定站点搜索条件，最多 20 个站点"
                  items:
                    type: "string"
                count:
                  type: "integer"
                  description: "返回的网页结果数量，默认为 10"
                  default: 10
                  minimum: 1
                  maximum: 50
                block_hosts:
                  type: "array"
                  maxItems: 5
                  description: "屏蔽域名列表，最多 5 个"
                  items:
                    type: "string"
                auth_info_level:
                  type: "integer"
                  description: "权威度过滤，0=不限制，1=仅非常权威"
                  enum:
                  - 0
                  - 1
                industry:
                  type: "string"
                  description: "行业搜索"
                  enum:
                  - "finance"
                  - "game"
                  - "gov"
                content_formats:
                  type: "string"
                  description: "正文格式"
                  enum:
                  - "text"
                  - "markdown"
                need_content:
                  type: "boolean"
                  description: "是否仅返回有正文的结果"
                need_url:
                  type: "boolean"
                  description: "是否仅返回有原文链接的结果"
                query_rewrite:
                  type: "boolean"
                  description: "是否开启 Query 改写"
              required:
              - "query"
      responses:
        "200":
          description: "成功的搜索响应"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebSearchResponse"
        "400":
          description: "请求参数错误"
        "401":
          description: "未授权 - API 密钥无效或缺失"
        "500":
          description: "搜索服务内部错误"
  /web-search/global:
    post:
      description: "火山引擎豆包搜索 Global 版。\n使用平台 Web 搜索格式，覆盖全球站点，并支持调整摘要长度和结果图片数量。\n"
      tags:
