          enum:
          - "Bespoke-Nimble-9B"
          - "APUS-OpenJev-v1-9B"
          - "APUS-OpenJev-v1-4B"
        state:
          description: "待判定的内容，可以是纯文本，也可以是结构化数据（对象或数组），如对话记录、业务记录或应用当前状态"
        questions:
          type: "object"
          description: "问题集合，键为调用方自定义的问题 ID，值为该问题的定义。多个问题会对同一 state 独立并行判定"
          additionalProperties:
            $ref: "#/components/schemas/SystemOneQuestion"
    SystemOneQuestion:
      type: "object"
      description: "单个问题定义，三种原语之一：choice（多选一）、score（有序量表评分）、noul（校准的是/否概率）"
      required:
      - "type"
      - "instructions"
      additionalProperties: true
      properties:
        type:
          type: "string"
          description: "问题原语类型"
          enum:
          - "choice"
          - "score"
          - "noul"
        instructions:
          description: "问题的完整描述。"
        criteria:
          description: "判定标准。choice 为「选项 -> 说明」的对象（最多 255 个选项，选项无需说明时值可为 null）；score\
            \ 为 2-10 个有序层级的数组；noul 可选填补充说明"
          oneOf:
          - type: "object"
            additionalProperties: true
          - type: "array"
            items: {}
    SystemOneAnswer:
      type: "object"
      description: "单个问题的答案，字段随 type 变化。choice 与 score 附带 confidence，noul 不含该字段（其取\
        值本身即「是」的概率）"
      required:
      - "type"
      additionalProperties: true
      properties:
        type:
          type: "string"
          description: "答案原语类型，与请求中对应问题的 type 一致"
          enum:
          - "choice"
          - "score"
          - "noul"
        choice:
          type: "string"
          description: "type=choice 时命中的选项"
        confidence:
          type: "number"
          description: "type=choice / score 时的校准置信度"
        probabilities:
          type: "object"
          description: "type=choice / score 时各选项或各层级的概率分布"
          additionalProperties: true
        noul:
          type: "number"
          description: "type=noul 时为「是」的概率，取值 0-1"
        score:
          type: "number"
          description: "type=score 时的连续评分，由各层级概率加权得出"
        legend:
          type: "object"
          description: "type=score 时层级序号到层级说明的映射"
          additionalProperties: true
    SystemOneResponseBody:
      type: "object"
      description: "System One 响应，answers 的键与请求 questions 的键一一对应"
      additionalProperties: true
      properties:
        model:
          type: "string"
          description: "实际执行判定的模型版本"
        answers:
          type: "object"
          additionalProperties:
            $ref: "#/components/schemas/SystemOneAnswer"
        usage:
          type: "object"
          description: "token 用量，用于计费"
          properties:
            input_tokens:
              type: "integer"
            output_tokens:
              type: "integer"
    CompletionsRequestBody:
      type: "object"
      description: "文本生成请求体"
      required:
      - "prompt"
      - "model"
      properties:
        model:
          type: "string"
          description: "模型标识符，用于指定用于文本生成的模型。支持大小写不敏感的命名空间格式（如Qwen2.5-Coder-32B-Instruct及\
            Qwen/Qwen2.5-Coder-32B-Instruct）"
          enum:
          - "deepseek-coder-33B-instruct"
          - "Qwen2.5-7B-Instruct"
          - "glm-4-9b-chat"
        stream:
          type: "boolean"
          description: "是否启用流式输出，默认为 true。启用**流式响应传输**，使模型生成的回复内容**以增量形式**（逐 token\
            \ 或逐数据块）**实时推送至客户端**，而非等待完整回复生成后一次性传输"
          default: true
        prompt:
          type: "string"
          description: "用于引导模型生成内容的输入提示字符串"
        best_of:
          type: "integer"
          description: "表示模型将生成的候选内容数量的整数值，模型会从中选取最优结果返回"
        echo:
          type: "boolean"
          description: "表示是否在 API 响应中包含输入提示的布尔标志，常用于调试场景，或在响应中同时显示输入内容与生成结果以增强清晰度"
        frequency_penalty:
          type: "number"
          description: "频率惩罚(重复内容抑制系数)，介于-2.0和2.0之间的数字，根据新标记在文本中的现有频率对新标记进行惩罚，以此减少\
            生成文本中重复内容的可能性"
        logit_bias:
          type: "object"
          description: "对数几率偏差，是大语言模型（LLM）中用于调整生成概率分布的高级控制参数。通过对特定 token 的 logits（\
            未归一化的预测分数）施加偏移量（bias），可以直接干预模型的生成倾向，实现对特定词汇、短语或内容的增强或抑制"
          additionalProperties:
            type: "number"
            format: "double"
            minimum: -100.0
            maximum: 100.0
          example:
            "1000": 99.9
            "1001": -99.9
        logprobs:
          type: "integer"
          description: "用于获取模型生成结果中各 token 的对数概率及候选 token 概率分布的字段。返回对象包含 tokens、token_logprobs、\
            top_logprobs。支持分析生成结果的概率合理性、调试模型决策过程，增强输出可解释性，适用于概率量化分析、生成过程透明化等场景"
        max_tokens:
          type: "integer"
          description: "最大生成长度，用于指定模型生成的回复内容（completion）允许的最大 token 数量"
        "n":
          type: "integer"
          description: "决定模型为同一输入生成的并行回复选项数量（如 n=3 时，输出 3 条不同的回复）。这些选项基于模型的概率分布独立采\
            样（遵循指定的温度、top-p 等采样参数）"
        presence_penalty:
          type: "number"
          description: "在场惩罚(新主题拓展系数)，介于-2.0和2.0之间的数字。根据新标记是否出现在文本中来惩罚它们，从而增加模型讨论新\
            主题的可能性"
        seed:
          type: "integer"
          description: "作为随机数生成器的初始化种子，控制模型生成过程中伪随机采样的确定性。当 seed 与其他生成参数（如 temperature、\
            top_p 等）固定时，理论上模型应生成相同的回复序列（假设后端无变化）"
        stop:
          oneOf:
          - type: "array"
            items:
              type: "string"
          - type: "string"
          description: "停止词，默认为 null 可以是一个字符串或字符串数组，用于指定生成终止的触发条件，即当模型生成的内容中出现预设的停\
            止序列（字符串或字符串数组）时，立即终止生成过程。返回的结果不包含这些停止序列，确保输出内容在遇到终止条件时精确截断"
          default: null
        suffix:
          type: "string"
          description: "用于指定模型生成结果后附加的后缀文本的字符串字段。该字段允许用户在模型生成的核心内容之后，追加固定的文本内容，以满足\
            特定格式要求"
        temperature:
          type: "number"
          description: "用于调整生成概率分布熵（Entropy）的参数，通过对模型输出的 logits（未归一化对数概率）进行温度缩放来控制\
            输出的随机性:较高的值（如 0.8）将使输出更随机，而较低的值（如 0.2）将使其更集中和确定性"
        top_p:
          type: "number"
          description: "核采样(Nucleus Sampling） 是一种概率质量截断策略，用于限定模型生成时考虑的 token 集合，默认\
            为 1.0。具体而言，模型按概率降序排列所有 token，累加其概率直至达到 top_p（如 0.9 表示前 90% 概率质量的 token\
            \ 集合），仅从该集合中采样下一个 token"
        user:
          type: "string"
          description: "唯一标识发送请求的最终用户"
          nullable: true
    ChatResponseBody:
      type: "object"
      description: "非流式对话生成响应，包含完整生成结果及元数据"
      required:
      - "id"
      - "choices"
      - "created"
      - "model"
      - "object"
      - "usage"
      properties:
        id:
          type: "string"
          description: "响应的唯一标识符，用于唯一标识当前非流式响应。这有助于在处理多个并发请求时区分不同的响应"
        choices:
          description: "生成结果选项的集合。每个对象代表一个完整生成结果，包含生成结果的具体内容和相关元数据"
          type: "array"
          items:
            type: "object"
            required:
            - "finish_reason"
            - "index"
            - "message"
            properties:
              finish_reason:
                type: "string"
                enum:
                - "stop"
                - "length"
                description: "**模型停止生成令牌的原因，可能的值包括**：  \n  **stop**：模型遇到了自然停止点或提供的\
                  停止序列，表示生成过程在逻辑上完成了  \n  **length**：达到了请求中指定的最大令牌数，表示生成过程因达到长度限制而\
                  停止\n"
              index:
                type: "number"
                format: "int"
                description: "在选择列表中当前选择的索引。用于指示当前生成结果在所有选择中的位置"
              message:
                type: "object"
                description: "非流式生成的完整结果内容。该对象包含模型生成的最终文本或其他数据类型"
                additionalProperties:
                  type: "string"
              logprobs:
                type: "object"
                description: "生成结果片段的对数概率信息。包含生成结果中每个令牌的对数概率，用于评估生成结果的置信度"
                required:
                - "tokens"
                - "token_logprobs"
                - "finish_reason"
                title: "ChatResponseLogprobs"
                properties:
                  tokens:
                    type: "array"
                    items:
                      type: "string"
                      description: "令牌数组，包含生成结果中的令牌。这些令牌是模型生成的基本单位，可以是单词、子词或其他类型的文\
                        本单元"
                  token_logprobs:
                    type: "array"
                    items:
                      type: "number"
                      format: "double"
                      description: "每个令牌的对数概率数组。用于表示每个令牌在生成过程中的概率，对数概率越高，表示该令牌的生成越\
                        可信"
                  finish_reason:
                    type: "string"
                    enum:
                    - "stop"
                    - "length"
        created:
          type: "integer"
          format: "timestamp"
          readOnly: true
          description: "当前对象生成的时间戳，表示响应的生成时间。用于客户端确定响应的时效性"
        object:
          type: "string"
          description: "响应对象类型，固定为 text_completion，表示这是一个文本完成响应。这有助于客户端识别响应的类型并进行相\
            应的处理"
          enum:
          - "text_completion"
        model:
          type: "string"
          description: "The model that was used to generate the completion."
        usage:
          type: "object"
          description: "Usage statistics for the completion request."
          required:
          - "prompt_tokens"
          - "completion_tokens"
          - "total_tokens"
          properties:
            prompt_tokens:
              type: "integer"
              description: "Number of tokens in the prompt."
            completion_tokens:
              type: "integer"
              description: "Number of tokens in the generated completion."
            total_tokens:
              type: "integer"
              description: "Total number of tokens used in the request (prompt + completion)."
    ChatStreamResponseBody:
      type: "object"
      description: "流式对话生成响应，以事件流形式返回分块生成结果"
      required:
      - "id"
      - "choices"
      - "created"
      - "model"
      - "object"
      properties:
        id:
          type: "string"
          description: "流式响应的唯一标识符，用于唯一标识当前流式响应。这有助于在处理多个并发请求时区分不同的响应流"
        choices:
          description: "流式生成结果片段的集合。每个对象代表一个生成结果片段，包含生成结果的具体内容和相关元数据"
          type: "array"
          items:
            type: "object"
            required:
            - "finish_reason"
            - "index"
            - "delta"
            properties:
              finish_reason:
                type: "string"
                enum:
                - "stop"
                - "length"
                description: "**模型停止生成令牌的原因,可能的值包括**：  \n  **stop**：模型遇到了自然停止点或提供的\
                  停止序列，表示生成过程在逻辑上完成了  \n  **length**：达到了请求中指定的最大令牌数，表示生成过程因达到长度限制而\
                  停止\n"
              index:
                type: "number"
                format: "int"
                description: "在选择列表中当前选择的索引。用于指示当前生成结果片段在所有选择中的位置"
              delta:
                type: "object"
                description: "流式生成结果片段。这个对象包含了当前生成结果片段的具体内容，可以是文本或其他数据类型"
                additionalProperties:
                  type: "string"
              logprobs:
                type: "object"
                description: "生成结果片段的对数概率信息。包含生成结果中每个令牌的对数概率，用于评估生成结果的置信度"
                required:
                - "tokens"
                - "token_logprobs"
                - "finish_reason"
                title: "ChatResponseLogprobs"
                properties:
                  tokens:
                    type: "array"
                    items:
                      type: "string"
                      description: "令牌数组，包含生成结果中的令牌。这些令牌是模型生成的基本单位，可以是单词、子词或其他类型的文\
                        本单元"
                  token_logprobs:
                    type: "array"
                    items:
                      type: "number"
                      format: "double"
                      description: "每个令牌的对数概率数组。用于表示每个令牌在生成过程中的概率，对数概率越高，表示该令牌的生成越\
                        可信"
                  finish_reason:
                    type: "string"
                    enum:
                    - "stop"
                    - "length"
        created:
          type: "integer"
          format: "timestamp"
          readOnly: true
          description: "当前对象生成的时间戳，表示响应的生成时间。这个时间戳可以帮助客户端确定响应的时效性"
        object:
          type: "string"
          description: "响应对象类型，固定为 text_completion，表示这是一个文本完成响应。这有助于客户端识别响应的类型并进行相\
            应的处理"
          enum:
          - "text_completion"
        model:
          type: "string"
          description: "The model that was used to generate the completion."
        usage:
          type: "object"
          description: "Usage statistics for the completion request."
          required:
          - "prompt_tokens"
          - "completion_tokens"
          - "total_tokens"
          properties:
            prompt_tokens:
              type: "integer"
              description: "Number of tokens in the prompt."
            completion_tokens:
              type: "integer"
              description: "Number of tokens in the generated completion."
            total_tokens:
              type: "integer"
              description: "Total number of tokens used in the request (prompt + completion)."
    ChatCompletionToolsParam:
      description: "工具参数"
      type: "object"
      properties:
        type:
          type: "string"
          enum:
          - "function"
          - "custom"
          default: "function"
          nullable: true
        function:
          $ref: "#/components/schemas/FunctionDefinition"
        custom:
          type: "object"
          additionalProperties: true
    FunctionDefinition:
      type: "object"
      description: "定义模型可调用的工具函数，是函数调用功能的核心载体。通过标准化的元数据描述，使模型能够理解函数的用途、输入格式，并生成对应的\
        函数调用请求，实现与外部工具（如 API、数据库、自定义函数）的交互"
      required:
      - "name"
      properties:
        name:
          description: "唯一标识函数的名称，模型通过该名称在工具列表中定位目标函数。名称需简洁、语义明确，避免与其他函数重名或产生歧义"
          type: "string"
        description:
          description: "描述函数的功能、输入输出逻辑及适用场景，帮助模型理解何时调用该函数"
          type: "string"
          nullable: true
        parameters:
          description: "定义函数的输入参数结构，遵循 JSON Schema 规范"
          type: "object"
          nullable: true
    ChatCompletionNamedToolChoiceParam:
      type: "object"
      required:
      - "function"
      properties:
        function:
          $ref: "#/components/schemas/ChatCompletionNamedFunction"
        type:
          description: "工具的类型。目前仅支持 function"
          type: "string"
          enum:
          - "function"
    ChatCompletionNamedFunction:
      description: "指定要调用的函数"
      type: "object"
      required:
      - "name"
      properties:
        name:
          description: "函数名称"
          type: "string"
    BaseModel:
      type: "object"
      nullable: true
    ChatCompletionDeveloperMessageParam:
      type: "object"
      title: "Developer message"
      required:
      - "content"
      - "role"
      properties:
        content:
          description: "开发者消息的内容。此字段包含开发者发送消息的主体内容"
          oneOf:
          - type: "string"
            description: "表示开发者消息内容的简单字符串"
            title: "Text content"
          - type: "array"
            items:
              $ref: "#/components/schemas/ChatCompletionContentPartTextParam"
            minItems: 1
            description: "文本内容部分的数组，允许构建更复杂的消息结构"
        role:
          type: "string"
          enum:
          - "developer"
          description: "为模型指定要遵循的指令或上下文，如定义语气、风格和其他行为指导。"
        name:
          type: "string"
          nullable: true
          description: "可选的名称字段，用于额外的识别信息，可以为空"
    ChatCompletionSystemMessageParam:
      title: "System Message"
      type: "object"
      required:
      - "content"
      - "role"
      properties:
        content:
          anyOf:
          - type: "string"
            description: "为模型指定要遵循的指令或上下文，如定义语气、风格和其他行为指导。"
          - items:
              $ref: "#/components/schemas/ChatCompletionContentPartTextParam"
              description: "文本内容部分的数组，支持构建复杂消息结构（如混合文本、元数据的多段内容）"
              title: "Complex content"
            type: "array"
          title: "Content"
          description: "系统消息的核心内容，包含系统向模型传递的指令、配置或上下文信息（必填）"
        role:
          description: "system messages：为模型指定要遵循的指令或上下文，如定义语气、风格和其他行为指导。"
          type: "string"
          enum:
          - "system"
        name:
          type: "string"
          nullable: true
          description: "可选的名称字段，用于附加识别信息（如系统模块名、版本号等，可为空）"
    ChatCompletionContentPartTextParam:
      type: "object"
      title: "text"
      required:
      - "text"
      - "type"
      properties:
        text:
          type: "string"
        type:
          type: "string"
          enum:
          - "text"
    ChatCompletionContentPartImageParam:
      type: "object"
      title: "image_url/Base64"
      required:
      - "image_url"
      - "type"
      properties:
        image_url:
          type: "object"
          properties:
            url:
              type: "string"
              description: "图像的URL或Base64编码数据"
            detail:
              type: "string"
              enum:
              - "auto"
              - "low"
              - "high"
        type:
          type: "string"
          enum:
          - "image_url"
    ChatCompletionContentPartAudioParam:
      type: "object"
      title: "input_audio"
      required:
      - "type"
      - "input_audio"
      properties:
        type:
          type: "string"
          enum:
          - "input_audio"
        input_audio:
          type: "object"
          required:
          - "data"
          - "format"
          properties:
            data:
              type: "string"
            format:
              type: "string"
              enum:
              - "wav"
              - "mp3"
    ChatCompletionContentPartAudioUrlParam:
      type: "object"
      title: "audio_url"
      required:
      - "type"
      - "audio_url"
      properties:
        type:
          type: "string"
          enum:
          - "audio_url"
        audio_url:
          type: "object"
          required:
          - "url"
          properties:
            url:
              type: "string"
    ChatCompletionContentPartFileParam:
      type: "object"
      title: "file"
      properties:
        file:
          type: "object"
          additionalProperties: true
        type:
          type: "string"
          enum:
          - "file"
    ChatCompletionUserMessageParam:
      title: "User Message"
      type: "object"
      required:
      - "content"
      - "role"
      properties:
        content:
          anyOf:
          - type: "string"
            description: "user message 是用户向AI模型发出的具体请求、问题或指令，代表用户希望模型执行的实际任务。"
          - items:
              anyOf:
              - $ref: "#/components/schemas/ChatCompletionContentPartTextParam"
              - $ref: "#/components/schemas/ChatCompletionContentPartImageParam"
              - $ref: "#/components/schemas/ChatCompletionContentPartAudioParam"
              - $ref: "#/components/schemas/ChatCompletionContentPartAudioUrlParam"
              - $ref: "#/components/schemas/ChatCompletionContentPartFileParam"
            type: "array"
            title: "Multimodal content"
            description: "多模态消息内容数组，可包含文本、图片、音频等多种类型的内容片段，用于构建复杂的用户消息（至少包含一个内容片段）"
          title: "Content"
          description: "用户发送给模型的核心消息内容，是与模型交互的关键输入，支持纯文本或多模态混合输入（必填）"
        role:
          type: "string"
          description: "消息发送者的角色，固定为 'user'，用于标识该消息来源于用户端（模型通过此角色区分不同来源的消息，必填）"
          enum:
          - "user"
        name:
          type: "string"
          description: "可选的用户标识字段，可填写用户名称、会话编号等额外信息，用于辅助识别或区分不同用户场景（可为空）"
          nullable: true
    ChatCompletionAssistantMessageParam:
      title: "Assistant Message"
      type: "object"
      required:
      - "role"
      properties:
        role:
          type: "string"
          enum:
          - "assistant"
          description: "消息发送者角色，固定为 'assistant'，标识该消息由模型（助手）生成，用于区分消息来源（必填）"
          title: "Sender role"
        content:
          nullable: true
          anyOf:
          - type: "string"
            nullable: true
            description: "助手消息的纯文本内容，如回答、解释等简单字符串（可为空，适用于纯文本响应场景）"
            title: "Text content"
          - type: "array"
            nullable: true
            items:
              anyOf:
              - $ref: "#/components/schemas/ChatCompletionContentPartTextParam"
              - $ref: "#/components/schemas/ChatCompletionContentPartRefusalParam"
            minItems: 1
            description: "多片段消息内容数组，支持文本、拒绝信息等混合格式（至少含一个片段，可为空，适用于复杂响应场景）"
            title: "Multipart content"
          title: "Content"
          description: "assistant message 是AI模型根据system指引和user请求生成的回复内容，代表模型对用户需求的\
            理解和响应。"
        function_call:
          $ref: "#/components/schemas/FunctionCall"
          nullable: true
          description: "助手对外部工具的调用信息（含函数名、参数等，用于触发工具执行，可为空，适用于工具增强型对话）"
          title: "Function call"
        name:
          type: "string"
          nullable: true
          description: "可选的助手标识，如名称、版本号等（用于区分不同助手实例，可为空）"
          title: "Optional identifier"
        refusal:
          nullable: true
          type: "string"
          description: "助手拒绝响应的原因说明（当模型无法/不愿回答时填充，可为空，用于异常场景反馈）"
          title: "Refusal reason"
        tool_calls:
          type: "array"
          items:
            nullable: true
            $ref: "#/components/schemas/ChatCompletionMessageToolCallParam"
            description: "助手对工具的调用记录数组（含多次工具交互信息，适用于多步骤工具调用场景，可为空）"
            title: "Tool calls"
        audio:
          type: "object"
          nullable: true
          required:
          - "id"
          properties:
            id:
              type: "string"
              description: "音频内容的唯一标识（用于关联音频资源，必填当音频字段存在时，支持多模态音频输出）"
              title: "Audio ID"
          description: "助手生成的音频内容元数据（含资源标识，可为空，适用于音频响应场景）"
          title: "Audio content"
    ChatCompletionContentPartRefusalParam:
      type: "object"
      required:
      - "refusal"
      - "type"
      properties:
        refusal:
          type: "string"
        type:
          type: "string"
          enum:
          - "refusal"
          title: "Type"
    ChatCompletionMessageToolCallParam:
      type: "object"
      nullable: true
      properties:
        id:
          type: "string"
        function:
          $ref: "#/components/schemas/Function"
        custom:
          type: "object"
          additionalProperties: true
        type:
          type: "string"
          enum:
          - "function"
          - "custom"
    Function:
      type: "object"
      properties:
        arguments:
          type: "string"
        name:
          type: "string"
    FunctionCall:
      type: "object"
      nullable: true
      required:
      - "arguments"
      - "name"
      properties:
        arguments:
          type: "string"
        name:
          type: "string"
    ChatCompletionToolMessageParam:
      title: "Tool Message"
      type: "object"
      required:
      - "role"
      - "content"
      properties:
        content:
          nullable: true
          anyOf:
          - type: "string"
            nullable: true
            description: "工具返回的纯文本结果，如数据查询结果、状态反馈等（支持单段文本输入，简洁传递工具信息）"
            title: "Text result"
          - items:
              anyOf:
              - $ref: "#/components/schemas/ChatCompletionContentPartTextParam"
              - $ref: "#/components/schemas/ChatCompletionContentPartImageParam"
            type: "array"
            minItems: 1
            description: "工具返回的多片段内容集合，可包含文本或图片结果（至少一个片段，适用于复杂工具输出场景）"
            title: "Multipart result"
          - type: "object"
            additionalProperties: true
          title: "Tool Output"
          description: "工具执行结果的反馈内容，包含工具调用后返回的数据、状态或错误信息"
        role:
          type: "string"
          enum:
          - "tool"
          description: "消息角色固定为 'tool'，标识此消息由外部工具生成（模型通过该角色区分工具反馈与其他消息类型，必填）"
          title: "Tool Identity"
        tool_call_id:
          type: "string"
          description: "工具调用的唯一标识，用于关联工具调用请求与本次反馈（必填，确保工具消息与对应的调用操作一一映射，支持多工具调用场景的\
            追踪）"
          title: "Tool Call Identifier"
    ChatCompletionFunctionMessageParam:
      title: "Function Message"
      type: "object"
      required:
      - "role"
      - "content"
      - "name"
      properties:
        content:
          type: "string"
          nullable: true
          description: "函数调用的执行结果，用于将函数计算输出传递给模型进行后续处理"
          title: "Function Result"
        name:
          type: "string"
          description: "函数的唯一标识符，用于指定当前调用的具体函数（如 'get_weather'），使模型能够匹配函数定义并解析输出（必\
            填，确保函数调用的精准性和可关联）"
          title: "Function Identifier"
        role:
          type: "string"
          enum:
          - "function"
          description: "消息角色固定为 'function'，标识此消息由外部函数生成（模型通过该角色区分函数反馈，与用户、助手等角色形成对\
            话体系中的功能型消息类别，必填）"
          title: "Function Role"
    PoseDetectionResp:
      type: "object"
      properties:
        num_keypoints:
          type: "integer"
          description: "检测到的人体数量"
        keypoints:
          type: "array"
          description: "检测到的每个人体关键点信息"
          items:
            type: "object"
            properties:
              id:
                type: "integer"
                description: "人体索引 ID"
              label:
                type: "string"
                description: "类别标签，一般为 \"person\""
              confidence:
                type: "number"
                description: "检测目标置信度"
              bbox:
                type: "array"
                description: "人体检测框 [x, y, width, height]"
                items:
                  type: "number"
              keypoints:
                type: "array"
                description: "COCO 17 个关键点，每个 [x, y, confidence]"
                items:
                  type: "array"
                  items:
                    type: "number"
    TranslateRequestBody:
      type: "object"
      description: "翻译请求体"
      required:
      - "model"
      - "q"
      - "target"
      properties:
        model:
          type: "string"
          description: "模型名称，大小写不敏感并且支持带有命名空间"
          default: "Hunyuan-MT-Chimera-7B"
          enum:
          - "HY-MT1.5-7B"
          - "Qwen3-32B"
        q:
          oneOf:
          - type: "array"
            description: "需要翻译的文本"
            items:
              type: "string"
              maxLength: 5000
          - type: "string"
            description: "需要翻译的文本"
            maxLength: 5000
          description: "需要翻译的文本，支持字符串或字符串数组。 为保证翻译质量与稳定性，**建议优先只传入单条文本**； 若使用数组形式，\
            请确保各文本语义相互独立，数组长度不超过 20。\n"
        source:
          type: "string"
          description: "源语言，支持语言列表见 [语言支持]()"
        target:
          type: "string"
          description: "目标语言，支持语言列表见 [语言支持]()"
          default: "zh"
    TranslateResponseBody:
      type: "object"
      description: "翻译响应体"
      required:
      - "translations"
      properties:
        translations:
          type: "array"
          description: "翻译结果列表，顺序与请求中 q 保持一致"
          items:
            type: "object"
            required:
            - "detected_source_language"
            - "translated_text"
            properties:
              detected_source_language:
                type: "string"
                description: "检测到的源语言"
              translated_text:
                type: "string"
                description: "翻译后的文本"
    Hunyuan3DParam:
      type: "object"
      properties:
        texture:
          type: "boolean"
          description: "是否生成纹理，注意传此参数会调用不同收费等级api"
          default: false
        seed:
          type: "number"
          description: "随机种子"
          default: 1234
        num_inference_steps:
          type: "number"
          description: "生成结果时模型执行迭代的次数。数值越大，生成的质量会更高"
          default: 5
        octree_resolution:
          type: "number"
          description: "影响 3D 渲染/体素划分精度，越高3D 细节越丰富"
          default: 128
        guidance_scale:
          type: "number"
          description: "调节模型在生成结果时对输入提示的遵从程度，数值越大，遵从越严格"
          default: 5
        type:
          type: "string"
          description: "输出格式(Hunyuan3D-2模型适用)"
          enum:
          - "glb"
          default: "glb"
    ImageLayerResponse:
      type: "object"
      title: "ImageLayerResponse"
      required:
      - "images"
      - "count"
      properties:
        images:
          type: "array"
          description: "分层后的图像结果列表"
          items:
            type: "object"
            required:
            - "image"
            - "width"
            - "height"
            - "content_type"
            properties:
              image:
                type: "string"
                description: "分层后的图像数据，通常为图片访问地址（URL）或 Base64 编码数据。\n"
              width:
                type: "integer"
                description: "分层图像的宽度（像素）"
                example: 1024
              height:
                type: "integer"
                description: "分层图像的高度（像素）"
                example: 1024
              content_type:
                type: "string"
                description: "分层图像的内容类型（MIME Type），如 image/png、image/webp。\n"
                example: "image/png"
        count:
          type: "integer"
          description: "实际返回的分层图像数量"
          example: 3
    TextToMusicParam:
      type: "object"
      required:
      - "model"
      properties:
        model:
          type: "string"
          description: "模型名称，大小写不敏感并且支持带有命名空间"
        task:
          type: "string"
          title: "Task"
          description: "任务类型，默认 text2music"
          default: "text2music"
          enum:
          - "text2music"
          - "retake"
          - "repaint"
          - "edit"
          - "extend"
        duration:
          type: "integer"
          title: "Duration"
          description: "音乐时长，默认 60 s"
          default: 60
          minimum: 30
          maximum: 240
        prompt:
          type: "string"
          title: "Prompt"
          description: "音乐描述，支持标签、场景、风格，用逗号分隔"
          default: ""
        lyrics:
          type: "string"
          title: "Lyrics"
          description: "歌词，支持 [verse] [chorus] [bridge] 结构，或 [instrumental] 表示纯音乐"
          default: ""
        reference_audio_strength:
          type: "number"
          title: "Reference Audio Strength"
          description: "参考音频权重 0–1，默认 0.5"
          default: 0.5
          minimum: 0
          maximum: 1
        infer_steps:
          type: "integer"
          title: "Infer Steps"
          description: "推理步数 1–60，默认 27"
          default: 27
          minimum: 1
          maximum: 60
        lora_name:
          type: "string"
          description: "已上传 LoRA 模型名称；留空表示不使用自定义风格权重"
        guidance_scale:
          type: "number"
          title: "Guidance Scale"
          description: "整体引导强度 0–200，默认 15"
          default: 15
          minimum: 0
          maximum: 200
        guidance_scale_text:
          type: "number"
          title: "Guidance Scale Text"
          description: "文本引导强度 0–200，默认 0"
          default: 0
          minimum: 0
          maximum: 200
        guidance_scale_lyric:
          type: "number"
          title: "Guidance Scale Lyric"
          description: "歌词引导强度 0–200，默认 0"
          default: 0
          minimum: 0
          maximum: 200
        scheduler_type:
          type: "string"
          title: "Scheduler Type"
          description: "采样器，euler（默认）或 heun"
          default: "euler"
          enum:
          - "euler"
          - "heun"
        cfg_type:
          type: "string"
          title: "Cfg Type"
          description: "引导类型，apg（默认）或 cfg / cfg_star"
          default: "apg"
          enum:
          - "cfg"
          - "apg"
          - "cfg_star"
        omega_scale:
          type: "number"
          title: "Omega Scale"
          description: "细节平滑度 −100–100，默认 10"
          default: 10
          minimum: -100
          maximum: 100
        seeds:
          type: "array"
          title: "Seeds"
          description: "随机种子列表，用于可重复生成"
          items:
            type: "integer"
        guidance_interval:
          type: "number"
          title: "Guidance Interval"
          description: "引导作用区间 0–1，默认 0.5"
          default: 0.5
          minimum: 0
          maximum: 1
        guidance_interval_decay:
          type: "number"
          title: "Guidance Interval Decay"
          description: "区间内引导衰减 0–1，默认 0"
          default: 0
          minimum: 0
          maximum: 1
        min_guidance_scale:
          type: "number"
          title: "Min Guidance Scale"
          description: "衰减结束最小引导强度 0–200，默认 3"
          default: 3
          minimum: 0
          maximum: 200
        use_erg_tag:
          type: "boolean"
          title: "Use Erg Tag"
          description: "对标签启用熵校正引导，默认 true"
          default: true
        use_erg_lyric:
          type: "boolean"
          title: "Use Erg Lyric"
          description: "对歌词启用熵校正引导，默认 true"
          default: true
        use_erg_diffusion:
          type: "boolean"
          title: "Use Erg Diffusion"
          description: "对扩散模型启用熵校正引导，默认 true"
          default: true
        src_task_id:
          type: "string"
          title: "Src Task Id"
          description: "原任务 ID；用于 retake / repaint / edit / extend 任务关联源生成记录"
        src_audio:
          type: "string"
          title: "Src Audio"
          description: "原音频文件内容（Base64 或二进制）"
        src_audio_url:
          type: "string"
          title: "Src Audio Url"
          description: "原音频 HTTPS 直链"
        retake_variance:
          type: "number"
          title: "Retake Variance"
          description: "retake/repaint 随机度 0–1，默认 0.2"
          default: 0.2
          minimum: 0
          maximum: 1.0
        repaint_start:
          type: "number"
          title: "Repaint Start"
          description: "repaint 起始时间 0–240 s，默认 0 s"
          default: 0
          minimum: 0
          maximum: 240
        repaint_end:
          type: "number"
          title: "Repaint End"
          description: "repaint 终止时间 0–240 s，默认 30 s"
          default: 30
          minimum: 0
          maximum: 240
        edit_type:
          type: "string"
          title: "Edit Type"
          description: "edit 类型：only_lyrics（仅改词）或 remix（旋律/风格混合）"
          default: "only_lyrics"
          enum:
          - "only_lyrics"
          - "remix"
        edit_target_prompt:
          type: "string"
          title: "Edit Target Prompt"
          description: "edit 目标描述"
        edit_target_lyrics:
          type: "string"
          title: "Edit Target Lyrics"
          description: "edit 目标歌词"
        edit_n_min:
          type: "number"
          title: "Edit N Min"
          description: "edit 强度范围 0–1，默认 0.6"
          default: 0.6
          minimum: 0
          maximum: 1
        edit_n_max:
          type: "integer"
          title: "Edit N Max"
          description: "edit 强度范围 0–1，默认 1"
          default: 1
          minimum: 0
          maximum: 1
        left_extend_length:
          type: "number"
          title: "Left Extend Length"
          description: "extend 左延伸时长 0–240 s；总时长 ≤ 240 s"
          default: 0
          minimum: 0
          maximum: 240
        right_extend_length:
          type: "number"
          title: "Right Extend Length"
          description: "extend 右延伸时长 0–240 s；总时长 ≤ 240 s"
          default: 30
          minimum: 0
          maximum: 240
    MultimodalVideoGenerationRequest:
      type: "object"
      additionalProperties: true
      required:
      - "model"
      - "content"
      properties:
        model:
          type: "string"
          description: "模型名称，大小写不敏感并且支持带有命名空间。"
        content:
          type: "array"
          minItems: 1
          description: "多模态输入内容列表。不同模型对媒体类型、数量和组合方式的支持范围不同。"
          items:
            oneOf:
            - $ref: "#/components/schemas/VideoGenerationTextContent"
            - $ref: "#/components/schemas/VideoGenerationImageContent"
            - $ref: "#/components/schemas/VideoGenerationVideoContent"
            - $ref: "#/components/schemas/VideoGenerationAudioContent"
    VideoGenerationTextContent:
      type: "object"
      required:
      - "type"
      - "text"
      properties:
        type:
          type: "string"
          enum:
          - "text"
        text:
          type: "string"
          minLength: 1
          description: "视频生成或编辑提示词，可引用同一 content 列表中的媒体内容。"
    VideoGenerationImageContent:
      type: "object"
      required:
      - "type"
      - "image_url"
      - "role"
      properties:
        type:
          type: "string"
          enum:
          - "image_url"
        image_url:
          $ref: "#/components/schemas/VideoGenerationMediaUrl"
        role:
          type: "string"
          example: "reference_image"
          description: "图片在视频生成任务中的用途，例如 first_frame、last_frame、reference_image。可选\
            值由具体模型决定。"
    VideoGenerationVideoContent:
      type: "object"
      required:
      - "type"
      - "video_url"
      - "role"
      properties:
        type:
          type: "string"
          enum:
          - "video_url"
        video_url:
          $ref: "#/components/schemas/VideoGenerationMediaUrl"
        role:
          type: "string"
          example: "reference_video"
          description: "视频在生成、编辑或延长任务中的用途，例如 reference_video、source_video。可选值由具体模型\
            决定。"
    VideoGenerationAudioContent:
      type: "object"
      required:
      - "type"
      - "audio_url"
      - "role"
      properties:
        type:
          type: "string"
          enum:
          - "audio_url"
        audio_url:
          $ref: "#/components/schemas/VideoGenerationMediaUrl"
        role:
          type: "string"
          example: "reference_audio"
          description: "音频在视频生成任务中的用途，例如 reference_audio、source_audio。可选值由具体模型决定。"
    VideoGenerationMediaUrl:
      type: "object"
      required:
      - "url"
      properties:
        url:
          type: "string"
          description: "可公开访问的媒体 URL 或模型服务支持的 Base64 Data URL。"
    InferenceTask:
      type: "object"
      description: "异步任务实体，请注意异步任务输出结果中包含的链接仅1天有效，请及时下载保存。"
      required:
      - "task_id"
      - "status"
      - "created_at"
      - "urls"
      properties:
        task_id:
          type: "string"
          description: "任务唯一标识，用于后续查询"
        output:
          type: "object"
          description: "仅在 status=success 时出现，包含图像链接或 Base64 内容；链接 1 天有效，请及时下载"
        status:
          type: "string"
          description: "任务状态：waiting / in_progress / success / failure / cancelled"
          enum:
          - "waiting"
          - "in_progress"
          - "success"
          - "failure"
          - "cancelled"
        created_at:
          type: "string"
          format: "date-time"
          description: "任务创建时间"
        started_at:
          type: "string"
          format: "date-time"
          description: "任务开始处理时间；未开始时为空"
        completed_at:
          type: "string"
          format: "date-time"
          description: "任务完成时间；未完成时为空"
        price:
          type: "number"
          format: "decimal"
          nullable: true
          description: "异步任务推理费用"
        currency:
          type: "string"
          description: "费用币种，默认 CNY"
          example: "CNY"
        urls:
          type: "object"
          description: "任务相关链接：get（查询任务）、cancel（取消任务）"
          properties:
            get:
              type: "string"
              description: "URL to get the task"
            cancel:
              type: "string"
              description: "URL to cancel the task"
    ImageDataUrl:
      type: "object"
      title: "URL"
      properties:
        url:
          type: "string"
          description: "图像的网络 URL"
    ImageDataBase64:
      type: "object"
      title: "Base64"
      properties:
        b64_json:
          type: "string"
          description: "图像的 Base64 编码"
    PaymentRecord:
      type: "object"
      required:
      - "ident"
      - "amount"
      - "price"
      - "type"
      - "status"
      - "created_at"
      properties:
        ident:
          type: "string"
          description: "支付订单号"
        amount:
          type: "number"
          format: "decimal"
          nullable: true
          description: "订单总价（原价）"
        price:
          type: "number"
          format: "decimal"
          description: "实际支付金额"
        type:
          $ref: "#/components/schemas/PaymentMethod"
        status:
          $ref: "#/components/schemas/OrderStatus"
        created_at:
          type: "integer"
          format: "int64"
          description: "用户创建时间（Unix 时间戳，毫秒）"
          example: 1754633185000
        pay_url:
          type: "string"
          description: "支付URL或者HTML"
    WorkflowInputs:
      type: "object"
      description: "运行流水线输入参数"
      required:
      - "inputs"
      properties:
        inputs:
          type: "object"
          description: "输入参数"
        response_mode:
          type: "string"
          enum:
          - "streaming"
          - "blocking"
          description: "响应模式，streaming表示流式输出，blocking表示阻塞输出"
        user:
          type: "string"
          description: "用户标识"
    WorkflowResult:
      type: "object"
      description: "流水线阻塞输出结果"
      required:
      - "workflow_run_id"
      - "data"
      properties:
        data:
          type: "object"
          description: "流水线运行结果数据"
          $ref: "#/components/schemas/WorkflowOutputs"
        workflow_run_id:
          type: "string"
          description: "流水线运行ID"
    WorkflowOutputs:
      type: "object"
      description: "流水线运行结果数据"
      required:
      - "status"
      - "outputs"
      - "total_steps"
      - "created_at"
      - "finished_at"
      - "elapsed_time"
      properties:
        outputs:
          type: "object"
          description: "输出内容"
        status:
          type: "string"
          description: "运行状态"
          enum:
          - "running"
          - "succeeded"
          - "failed"
          - "stopped"
        error:
          type: "string"
          description: "错误信息"
        total_steps:
          type: "integer"
          description: "总步骤数"
        created_at:
          type: "string"
          format: "date-time"
          description: "开始时间"
        finished_at:
          type: "string"
          format: "date-time"
          description: "结束时间"
        elapsed_time:
          type: "number"
          format: "double"
          description: "运行耗时，单位为秒"
    WorkflowChunkResult:
      type: "object"
      description: "流水线流式输出结果"
      required:
      - "workflow_run_id"
      - "data"
      properties:
        event:
          type: "string"
          description: "事件类型"
          enum:
          - "node_started"
          - "node_finished"
          - "workflow_finished"
          - "workflow_started"
          - "text_chunk"
        data:
          type: "object"
          description: "具体数据，不同event对应不同数据"
          oneOf:
          - $ref: "#/components/schemas/WorkflowChunkNodeData"
          - $ref: "#/components/schemas/WorkflowChunkData"
        workflow_run_id:
          type: "string"
          description: "流水线运行ID"
    WorkflowChunkNodeData:
      description: "当event为node_started或node_finished时输出的data数据"
      type: "object"
      properties:
        node_id:
          type: "string"
          description: "节点 ID"
        status:
          type: "string"
          description: "节点状态"
        input_data:
          type: "object"
          additionalProperties: true
          description: "输入数据（JSON 对象）"
        output_data:
          type: "object"
          additionalProperties: true
          description: "输出数据（JSON 对象）"
        created_at:
          type: "string"
          format: "date-time"
          description: "创建时间"
        finished_at:
          type: "string"
          format: "date-time"
          description: "完成时间"
        error:
          type: "string"
          description: "错误信息（如果有）"
        elapsed_time:
          type: "number"
          format: "double"
          description: "执行耗时（秒）"
    WorkflowChunkData:
      type: "object"
      description: "当event为workflow_started或workflow_finished时输出的data数据"
      properties:
        workflow_run_id:
          type: "string"
          description: "流水线运行 ID"
        status:
          type: "string"
          description: "流水线状态（枚举值，例如：PENDING、RUNNING、SUCCESS、FAILED）"
        inputs:
          type: "object"
          additionalProperties: true
          description: "流水线输入参数"
        outputs:
          type: "object"
          additionalProperties: true
          description: "流水线输出结果"
        definition:
          type: "object"
          additionalProperties: true
          description: "流水线定义 JSON"
        error:
          type: "string"
          description: "错误信息（如果执行失败）"
        created_at:
          type: "string"
          format: "date-time"
          description: "创建时间"
        finished_at:
          type: "string"
          format: "date-time"
          description: "完成时间"
        total_steps:
          type: "integer"
          description: "总步骤数"
        elapsed_time:
          type: "number"
          format: "double"
          description: "执行耗时（秒）"
    DiscountInfo:
      type: "object"
      required:
      - "type"
      - "value"
      - "unit"
      description: "优惠规则的详细定义。"
      properties:
        type:
          $ref: "#/components/schemas/DiscountTypeEnums"
        value:
          type: "number"
          description: "优惠值，用于定义优惠的具体数额或数量。   - 当优惠类型为 `AMOUNT` 时：  \n  表示金额类优惠。 \
            \ \n  - 若付费计划为 **按量制**（即基于使用量计费），则该值代表**赠送金额**。  \n  - 若付费计划为 **订阅制**（\
            即周期性付费），则该值代表**减免金额**。  \n- 当优惠类型为 `FREE` 时：  \n  可结合 `unit` 表示赠送的时长（例\
            如赠送 1 个月、7 天等）。\n"
        unit:
          $ref: "#/components/schemas/DiscountUnitEnums"
    DiscountTypeEnums:
      type: "string"
      description: "优惠类型枚举，用于标识优惠的计算方式。   - `AMOUNT`：金额优惠，例如立减 10 元。   - `FREE`：免费\
        赠送类型，例如赠送 1 个月使用期。\n"
      enum:
      - "AMOUNT"
      - "FREE"
    DiscountUnitEnums:
      type: "string"
      description: "优惠单位枚举，用于定义优惠值的计量单位。   - `CNY`：人民币金额。   - `DAY`：天数。   - `WEEK`：\
        周数。   - `MONTH`：月数。   - `YEAR`：年数。\n"
      enum:
      - "CNY"
      - "DAY"
      - "WEEK"
      - "MONTH"
      - "YEAR"
    AppUserSubscription:
      type: "object"
      description: "用户订阅信息"
      required:
      - "id"
      - "pay_plan_ident"
      - "billing_type"
      - "status"
      properties:
        id:
          type: "string"
          description: "订阅记录ID"
        pay_plan_ident:
          type: "string"
          description: "订阅的收费计划标识"
        billing_type:
          type: "string"
          description: "计费类型:\nSUBSCRIPTION-订阅计费\nUSAGE_BASED-按量计费\n"
          enum:
          - "SUBSCRIPTION"
          - "USAGE_BASED"
        billing_multiplier:
          type: "number"
          description: "计费倍数,按量计费必传"
        expired_at:
          type: "integer"
          format: "int64"
          description: "订阅的到期时间（Unix 时间戳，毫秒）"
          example: 1754633185000
        status:
          type: "string"
          description: "用户购买状态，生效：ACTIVE，待生效：PENDING"
          enum:
          - "ACTIVE"
          - "PENDING"
        amount:
          type: "number"
          description: "当前订阅总充值金额，单位为“元”，精确到分（最小单位为0元）。\n"
        balance:
          type: "number"
          description: "当前订阅余额，单位为“元”，精确到分（最小单位为0元）。\n"
        effective_at:
          type: "integer"
          format: "int64"
          description: "订阅生效时间（Unix 时间戳，毫秒）"
          example: 1754633185000
        discounts:
          type: "array"
          description: "使用的优惠信息"
          items:
            $ref: "#/components/schemas/DiscountInfo"
    AppUserInfo:
      type: "object"
      description: "应用用户信息,包含用户信息及用户订阅信息"
      required:
      - "user_id"
      - "status"
      - "created_at"
      - "purchase_status"
      properties:
        user_id:
          type: "string"
          description: "用户ID，同一用户不同应用下的 user_id 相同"
        mobile:
          type: "string"
          description: "手机号"
        email:
          type: "string"
          description: "邮箱"
        status:
          type: "string"
          description: "用户状态,正常：NORMAL，禁用：DISABLED"
          enum:
          - "NORMAL"
          - "DISABLED"
        created_at:
          type: "integer"
          format: "int64"
          description: "用户创建时间（Unix 时间戳，毫秒）"
          example: 1754633185000
        purchase_status:
          type: "string"
          description: "用户购买状态，生效：ACTIVE，过期：EXPIRED，用尽：EXHAUSTED，未购买：NOT_PURCHASED"
          enum:
          - "ACTIVE"
          - "EXPIRED"
          - "EXHAUSTED"
          - "NOT_PURCHASED"
        pay_plan_ident:
          type: "string"
          description: "｜ 当前生效的计费计划标识，如果购买了按量计费优先返回最早购买有效的按量计费标识。 按量计费在购买成功后立即生效，订\
            阅计费按设定时间生效。"
        usage_expired_at:
          type: "integer"
          format: "int64"
          description: "应用的使用到期时间，仅在购买订阅计划后返回该字段（Unix 时间戳，毫秒）。"
          example: 1754633185000
        amount:
          type: "number"
          description: "当前用户总充值金额，单位为“元”，精确到分（最小单位为0元）。仅包含按量计费充值金额。\n"
        balance:
          type: "number"
          description: "当前用户余额，单位为“元”，精确到分（最小单位为0元）。仅包含按量计费余额。\n"
        subscriptions:
          type: "array"
          description: "当前用户“生效中”或“待生效”的订阅记录列表"
          items:
            $ref: "#/components/schemas/AppUserSubscription"
    AppInfo:
      type: "object"
      description: "应用信息"
      required:
      - "name"
      - "status"
      properties:
        appid:
          type: "string"
          description: "应用ID，用于唯一标识应用"
        name:
          type: "string"
          description: "应用名称"
        status:
          type: "string"
          description: "应用状态说明：\n- DRAFT：草稿，应用已创建但未提交审核\n- PENDING：待审核\n- REJECTED：\
            审核未通过\n- APPROVED：审核通过，待发布\n- PUBLISHED：已发布\n- UNPUBLISH：已下架\n"
          enum:
          - "DRAFT"
          - "PENDING"
          - "REJECTED"
          - "APPROVED"
          - "PUBLISHED"
          - "UNPUBLISH"
        payment_plans:
          description: "应用收费计划信息"
          type: "array"
          items:
            $ref: "#/components/schemas/PaymentPlan"
    PaymentPlan:
      type: "object"
      required:
      - "ident"
      - "type"
      - "period"
      - "period_type"
      - "usage_limit"
      - "price"
      properties:
        ident:
          type: "string"
          description: "收费计划标识"
        billing_type:
          type: "string"
          description: "计费类型：\n- SUBSCRIPTION：订阅计费\n- USAGE_BASED：按量计费\n"
          enum:
          - "SUBSCRIPTION"
          - "USAGE_BASED"
        billing_multiplier:
          type: "number"
          description: "计费倍率，用于按量计费时的费用计算。"
        name:
          type: "string"
          description: "名称"
        period:
          type: "string"
          description: "计费周期：\n- YEAR：年\n- MONTH：月\n- DAY：日\n- NONE：不限制周期，表示可永久使用\n"
          enum:
          - "YEAR"
          - "MONTH"
          - "DAY"
          - "NONE"
        period_type:
          type: "integer"
          description: "计费周期方式：0-相对周期，1-自然周期。\n仅在 period 为 YEAR 或 MONTH 时有效。\n- period_type\
            \ 为 0 时，表示从购买之日起的相对有效期。\n- period_type 为 1 时，表示从购买之日起至周期年最后一天的 23:59:59。\
            \n"
          enum:
          - 0
          - 1
        period_quantity:
          type: "integer"
          description: "表示周期数量。例如，若 period 为 MONTH 且数量为 2，则表示 2 个月。"
        price:
          type: "number"
          format: "float"
          description: "定价,仅在订阅计费时有效，单位为“元”，精确到分（最小单位为0元）。"
        description:
          type: "string"
          description: "收费计划的详细说明"
        discounts:
          type: "array"
          description: "该收费计划可使用的优惠方案列表。   当前仅支持配置一个优惠方案，因此返回结果中最多包含一条数据。\n"
          items:
            allOf:
            - $ref: "#/components/schemas/DiscountInfo"
            - type: "object"
              properties:
                effective_at:
                  type: "integer"
                  format: "int64"
                  description: "优惠生效时间（Unix 时间戳，单位：**毫秒**）。   表示该优惠从此时间开始可用。   如果该\
                    字段为空，表示优惠**立即生效**且**不受开始时间限制**。\n"
                expired_at:
                  type: "integer"
                  format: "int64"
                  description: "优惠失效时间（Unix 时间戳，单位：**毫秒**）。   超过该时间后，优惠将不再可用。   如果\
                    该字段为空，表示优惠**无截止时间**，即**长期有效**。\n"
