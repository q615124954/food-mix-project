                  - "[preset]LZ_2DCartoon_V2"
                  - "[preset]meinamix_v12Final"
                  - "[preset]animedark_v10"
                  - "[preset]absolutereality_v181"
                  - "[preset]dreamshaper_8"
                  - "[preset]epicphotogasm_ultimateFidelity"
                  - "[preset]epicrealism_naturalSinRC1VAE"
                  - "[preset]xxmix9realistic_v40"
                  - "[preset]cyberrealistic_v80"
                version:
                  type: "string"
                  description: "生成视频所需的模型版本，默认为HelloMemeV5。"
                  default: "HelloMemeV5"
                  enum:
                  - "HelloMemeV1"
                  - "HelloMemeV2"
                  - "HelloMemeV3"
                  - "HelloMemeV4"
                  - "HelloMemeV5"
                stylize:
                  type: "string"
                  description: "生成视频所需的风格名称，默认为x1。"
                  default: "x1"
                  enum:
                  - "x1"
                  - "x2"
                control_version:
                  type: "string"
                  description: "生成视频所需的ControlNet版本，默认为HMControlNet2。"
                  default: "HMControlNet2"
                  enum:
                  - "HMControlNet1"
                  - "HMControlNet2"
                lora_scale:
                  type: "number"
                  format: "float"
                  minimum: 0
                  maximum: 10
                  description: "生成视频的Lora强度，数值越高则生成的视频与Lora越贴近。"
                  default: 1
                guidance:
                  type: "number"
                  format: "float"
                  minimum: 0
                  maximum: 20
                  description: "生成视频的引导强度，数值越高则生成的视频与提示词越贴近。"
                  default: 1.5
                trans_ratio:
                  type: "number"
                  format: "float"
                  minimum: 0
                  maximum: 10
                  description: "生成视频的风格迁移比例，数值越高越贴近Lora。"
                  default: 1
                steps:
                  type: "integer"
                  minimum: 1
                  maximum: 50
                  description: "生成视频的步数，其越高则视频精细度越高，步数增加存在边际效应。"
                  default: 25
                crop_reference:
                  type: "boolean"
                  description: "是否裁剪参考视频以适应生成视频的尺寸。"
                  default: true
                patch_overlap:
                  type: "integer"
                  minimum: 1
                  description: "生成视频的重叠区域大小，默认为4。"
                  default: 4
                use_fps8:
                  type: "boolean"
                  description: "是否将生成的视频帧率设置为8fps，默认为True。"
                  default: true
            encoding:
              ref_image:
                contentType: "image/*,application/octet-stream"
              drive_video:
                contentType: "video/*,application/octet-stream"
      responses:
        "200":
          description: "异步任务详情"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InferenceTask"
