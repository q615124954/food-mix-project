        权,“用户访问令牌”通过获取用户访问凭证接口获取\n"
      tags:
      - "AI 应用市场接口"
      security:
      - AppAccessTokenAuth: []
      requestBody:
        content:
          multipart/form-data:
            encoding:
              cover:
                contentType: "image/*"
            schema:
              type: "object"
              required:
              - "type"
              - "description"
              properties:
                type:
                  type: "string"
                  enum:
                  - "BUG"
                  - "SUGGESTION"
                  - "OTHER"
                  description: "反馈类型，支持 BUG、建议或其他"
                description:
                  type: "string"
                  description: "反馈描述"
                  minLength: 10
                  maxLength: 2500
                attachment:
                  type: "array"
                  description: "反馈附件（最多3个，且必须是图片）"
                  items:
                    type: "string"
                    format: "binary"
                    description: "图片附件"
                  maxItems: 3
                contact_type:
                  type: "string"
                  description: "联系方式类型（例如：email, phone）"
                  nullable: true
                contact:
                  type: "string"
                  description: "联系方式（如邮箱地址或电话号码）"
                  nullable: true
      responses:
        "200":
          description: "反馈提交结果"
          content:
            application/json:
              schema:
                type: "boolean"
                description: "反馈意见是否提交成功"
        "400":
          description: "请求数据缺失或格式错误"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  success:
                    type: "boolean"
                  message:
                    type: "string"
                    example: "缺少必要的字段"
        "500":
          description: "服务器错误"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  success:
                    type: "boolean"
                  message:
                    type: "string"
                    example: "服务器发生错误，请稍后重试"
  /app/exception/log:
    post:
