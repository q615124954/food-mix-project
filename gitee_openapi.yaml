              required:
              - "query"
      responses:
        "200":
          description: "成功的搜索响应"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebSearchResponse"
        "400":
          description: "请求参数错误"
        "401":
          description: "未授权 - API 密钥无效或缺失"
        "500":
