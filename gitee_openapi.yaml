    get:
      summary: "获取支付列表"
      operationId: "app.listPayments"
      description: "获取当前用户支付记录列表。\n\n**鉴权方式：**\n- 需使用“用户访问令牌”进行鉴权,“用户访问令牌”通过获取用户访问\
