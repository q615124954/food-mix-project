                  - 3000
      responses:
        "200":
          description: "操作结果"
          content:
            application/json:
              schema:
                type: "array"
                description: "每个实例的操作结果"
                items:
                  type: "object"
                  properties:
                    id:
                      type: "string"
                      description: "实例 ID"
                    success:
                      type: "boolean"
                      description: "该实例操作是否成功"
                    error:
                      type: "string"
                      description: "失败时的错误信息，成功时不返回"
