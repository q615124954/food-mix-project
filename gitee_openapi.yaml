openapi: "3.0.3"
info:
  version: "1.0.0"
  title: "模力方舟开放接口"
  description: "欢迎使用模力方舟开放接口。\n\n模力方舟开放接口旨在为开发者、企业用户以及平台合作方提供统一、稳定的 API 接入能力，帮助您高效\
    接入我们提供的各类智能服务。无论您是希望将智能生成能力集成到自己的应用中，还是构建属于自己的 AI 工具链，本接口都为您提供了清晰的调用方式、完善的权限控制\
    与详尽的数据结构说明。\n\n### 快速使用\n\n本接口兼容 OpenAI 的接口规范，可直接用 OpenAI SDK 进行调用。 示例代码：\n\n\
    ```python\nfrom openai import OpenAI\n\nclient = OpenAI(\n  base_url=\"https://ai.gitee.com/v1\"\
    ,\n  api_key=\"XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\",\n)\n\nresponse = client.chat.completions.create(\n\
    \  messages=[\n    {\n      \"role\": \"system\",\n      \"content\": \"You are\
    \ a helpful and harmless assistant. You should think step-by-step.\"\n    },\n\
    \    {\n      \"role\": \"user\",\n      \"content\": \"Can you please let us\
    \ know more details about your \"\n    }\n  ],\n    model=\"DeepSeek-V3\",\n \
    \   stream=True,\n    max_tokens=1024,\n    temperature=0.6,\n    top_p=0.8,\n\
    \    extra_body={\n  \"top_k\": 20,\n  },\n  frequency_penalty=1.1,\n)\n```\n\n\
    ### 认证方式\n\n**认证方式概述**   \n  模力方舟 API 采用 Bearer Token（令牌） 认证机制，通过在 HTTP 请求头中携带\
    访问令牌，验证调用者身份及权限。  \n\n**创建访问令牌与临时令牌**  \n  请参考 Gitee AI 说明文档\n  https://ai.gitee.com/docs/organization/access-token\n\
    \n**API 调用格式**  \n  Authorization: Bearer <你的访问令牌>    \n\n如果认证失败，将会返回如下错误内容：\n\
    \n```json\n{\n  \"error\": {\n      \"code\": \"401\",\n      \"message\": \"\
    Unauthorized\",\n      \"type\": \"server_error\"\n  }\n}\n```\n"
  contact:
    name: "Gitee AI"
    url: "https://ai.gitee.com/about"
    email: "gitee-ai@oschina.cn"
