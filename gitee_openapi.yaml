                                description: "单词开始时间（秒）"
                                example: 0.0
                              end:
                                type: "number"
                                format: "float"
                                description: "单词结束时间（秒）"
                                example: 0.44
                              probability:
                                type: "number"
                                format: "float"
                                description: "单词识别概率，0–1"
                                example: 0.9622822105884552
  /embeddings:
    post:
      summary: "向量生成"
      operationId: "serverless-api.openai_embeddings"
      description: "该接口用于获取 Serverless 支持的词向量，将任意中文或英文文本映射为稠密向量，用于语义检索、聚类或下游模型输入，该\
        接口需要使用 Access Token 进行授权。"
      tags:
      - "特征抽取"
      security:
      - AccessTokenAuth: []
      - AppAccessTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              title: "OpenAIEmbeddingsRequestBody"
              required:
              - "model"
              - "input"
              properties:
                model:
                  type: "string"
                  description: "模型名称，大小写不敏感并且支持带有命名空间，例如bge-m3及BAAI/bge-m3都可支持。"
                  enum:
                  - "Qwen3-Embedding-0.6B"
                  - "jina-clip-v1"
                  - "jina-clip-v2"
                  - "jina-embeddings-v4"
                  - "bge-m3"
                  - "Qwen3-VL-Embedding-8B"
                  - "all-mpnet-base-v2"
                  - "WeMM-Embedding-9B"
                  - "Qwen3-Embedding-8B"
                  - "Qwen3-VL-Embedding-2B"
                  - "WeMM-Embedding-4B"
                  - "bce-embedding-base_v1"
                  - "WeMM-Embedding-2B"
                  - "bge-small-zh-v1.5"
                  - "Qwen3-Embedding-4B"
                  - "bge-large-zh-v1.5"
                input:
                  oneOf:
                  - type: "string"
                    description: "输入待编码文本"
                  - type: "array"
                    maxItems: 1000
                    items:
                      type: "string"
                    description: "输入待编码文本数组"
                  - type: "array"
                    items:
                      type: "integer"
                      minimum: 0
                    description: "输入待编码 token ID 数组"
                  - type: "array"
                    maxItems: 1000
                    items:
                      type: "array"
                      items:
                        type: "integer"
                        minimum: 0
                    description: "输入待编码 token ID 数组批次"
                  - type: "array"
                    description: "多模态输入参数列表"
                    maxItems: 1000
                    items:
                      oneOf:
                      - type: "object"
                        title: "text"
                        required:
                        - "text"
                        properties:
                          text:
                            type: "string"
                            description: "文本内容"
                      - type: "object"
                        title: "image"
                        required:
                        - "image"
                        properties:
                          image:
                            type: "string"
                            description: "图像数据 (Base64 编码的图像)"
                encoding_format:
                  type: "string"
                  description: "向量数值格式"
                  default: "float"
                dimensions:
                  type: "integer"
                  description: "返回向量的维度；留空则使用模型默认值"
                user:
                  type: "string"
                  description: "唯一标识发送请求的最终用户"
                  nullable: true
      responses:
        "200":
          description: "向量结果"
          content:
            application/json:
              schema:
                type: "object"
                title: "OpenAIEmbeddingsResponse"
                required:
                - "model"
                - "data"
                - "object"
                properties:
                  object:
                    type: "string"
                    description: "返回的对象类型"
                    default: "list"
                  data:
                    type: "array"
                    description: "向量列表"
                    items:
                      type: "object"
                      properties:
                        object:
                          type: "string"
                          description: "返回的对象类型"
                          default: "embedding"
                        embedding:
                          type: "array"
                          description: "稠密向量，维度由模型或 dimensions 参数决定"
                          items:
                            type: "number"
                            format: "float"
                            description: "embedding results"
                        index:
                          type: "integer"
                          format: "int32"
                          description: "向量在列表中的索引"
                  model:
                    type: "string"
                    description: "模型名称"
                  usage:
                    type: "object"
                    properties:
                      prompt_tokens:
                        type: "integer"
                        description: "输入文本占用的 token 数"
                      total_tokens:
                        type: "integer"
                        description: "总 token 数"
  /sentence-similarity:
    post:
      summary: "句子相似度对比"
      operationId: "serverless-api.openai_sentence_similarity"
      description: "该接口用于调用 Serverless 计算一段原文本与一组候选句子之间的语义相似度得分，用于排序、去重或检索。"
      tags:
      - "特征抽取"
      security:
      - AccessTokenAuth: []
      - AppAccessTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              title: "SentenceSimilarityRequestBody"
              required:
              - "inputs"
              - "model"
              properties:
                model:
                  type: "string"
                  description: "模型名称，大小写不敏感并且支持带有命名空间，例如bge-reranker-v2-m3及BAAI/bge-reranker-v2-m3都\
                    可支持。"
                  enum:
                  - "bce-reranker-base_v1"
