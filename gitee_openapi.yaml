      description: "该接口用于调用 Serverless 完成文本生成语音推理，该接口需要使用 Access Token 进行授权。"
      tags:
      - "语音合成"
      security:
      - AccessTokenAuth: []
      - AppAccessTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              title: "Text2SpeechRequestBody"
              required:
              - "input"
              - "model"
              properties:
                model:
                  type: "string"
                  description: "模型名称，大小写不敏感并且支持带有命名空间，例如whisper-large-v3-turbo及openai/whisper-large-v3-turbo都\
                    可支持。"
                  enum:
                  - "GLM-TTS"
                  - "TeleTTS-Mandarin"
                  - "Step-Audio-TTS-3B"
                  - "IndexTTS-2"
                  - "ChatTTS"
                  - "VoxCPM2"
                  - "VoxCPM2-Pro"
                  - "CosyVoice2"
                input:
                  type: "string"
                  description: "要转换为语音的文本"
                response_data_format:
                  type: "string"
                  description: "响应格式，url格式会返回JSON对象包含音频文件URL，blob格式返回二进制音频流"
                  enum:
                  - "url"
                  - "blob"
                  default: "blob"
          application/x-www-form-urlencoded:
            schema:
              type: "object"
              title: "Text2SpeechFormRequestBody"
              required:
              - "input"
              - "model"
              properties:
                model:
                  type: "string"
                  description: "模型名称，大小写不敏感并且支持带有命名空间，例如whisper-large-v3-turbo及openai/whisper-large-v3-turbo都\
                    可支持。"
                input:
                  type: "string"
                  description: "要转换为语音的文本"
                response_data_format:
                  type: "string"
                  description: "响应格式，url格式会返回JSON对象包含音频文件URL，blob格式返回二进制音频流"
                  enum:
                  - "url"
                  - "blob"
                  default: "blob"
          multipart/form-data:
            schema:
              type: "object"
              title: "Text2SpeechMultipartRequestBody"
              required:
              - "input"
              - "model"
              properties:
                model:
                  type: "string"
                  description: "模型名称，大小写不敏感并且支持带有命名空间，例如whisper-large-v3-turbo及openai/whisper-large-v3-turbo都\
                    可支持。"
                input:
                  type: "string"
                  description: "要转换为语音的文本"
                response_data_format:
                  type: "string"
                  description: "响应格式，url格式会返回JSON对象包含音频文件URL，blob格式返回二进制音频流"
                  enum:
                  - "url"
                  - "blob"
                  default: "blob"
      responses:
        "200":
          description: "音频生成成功"
          content:
            application/octet-stream:
              schema:
                type: "string"
                format: "binary"
                description: "二进制音频内容（当response_data_format为blob时返回）"
            application/json:
              schema:
                type: "object"
                description: "音频文件信息（当response_data_format为url时返回）"
                required:
                - "url"
                - "created"
                - "format"
                properties:
                  url:
                    type: "string"
                    description: "音频文件的下载URL，有效期1小时"
                  created:
                    type: "integer"
                    description: "任务创建时间"
                  format:
                    type: "string"
                    description: "音频格式（wav或mp3）"
                    enum:
                    - "wav"
                    - "mp3"
