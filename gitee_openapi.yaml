                          format: "float"
                          description: "该段被判定为无语音的概率，值高时可考虑过滤"
                          example: 0.009401053190231323
                        words:
                          type: "array"
                          description: "单词级时间戳"
                          items:
                            type: "object"
                            properties:
                              word:
                                type: "string"
                                description: "单词文本"
                                example: "燃"
                              start:
                                type: "number"
                                format: "float"
                                description: "单词开始时间（秒）"
                                example: 0.0
                              end:
                                type: "number"
                                format: "float"
                                description: "单词结束时间（秒）"
                                example: 0.44
                              probability:
