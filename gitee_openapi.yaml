                                name:
                                  type: "string"
                                  description: "视频的名称"
                                description:
                                  type: "string"
                                  description: "视频的描述"
                                thumbnailUrl:
                                  type: "string"
                                  description: "视频的缩略图URL"
                                publisher:
                                  type: "array"
                                  items:
