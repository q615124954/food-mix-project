                                datePublished:
                                  type: "string"
                                  nullable: true
                                  description: "图像的发布日期"
                                contentUrl:
                                  type: "string"
                                  description: "访问全尺寸图像的URL"
                                  example: "http://dayu-img.uc.cn/columbus/img/oc/1002/45628755e2db09ccf7e6ea3bf22ad2b0.jpg"
