- name: "企业信息查询"
  description: "提供企业基础工商信息查询能力，支持按统一社会信用代码或企业名称查询企业基本信息、工商信息、分支机构、变更记录、股东、主要人员、企业类\
    型、曾用名及经营异常等数据。\n"
- name: "AI 应用市场接口"
  description: "提供 AI 应用市场的相关能力接口，支持应用的发布、查询、使用统计、授权管理等功能。该标签下的接口用于帮助开发者将基于模型的应用能力\
    进行上架、分发与集成，同时也支持企业或个人用户在平台中发现、试用与使用各类 AI 应用。\n\nAI 应用市场适用于构建可扩展的应用生态，帮助开发者快速将\
    \ AI 能力产品化，同时为企业用户提供丰富的场景应用选择，包括文本创作、图像处理、音视频生成、搜索增强、数据分析等一站式 AI 工具。\n"
- name: "文本生成"
  description: "提供基于大语言模型的文本生成与理解能力，支持多种文本创作、问答对话、信息提取与内容改写需求。可用于内容生产、智能客服、代码生成、知识\
    问答、营销文案等场景。\n\n本标签下的接口主要包括：\n\n- **通用文本生成（Text Completion / Chat Completion）**\
    \  \n  根据输入提示词生成自然语言内容，适用于写作辅助、故事创作、摘要生成、知识问答、邮件撰写等任务。\n- **结构化输出与指令遵循**  \n \
    \ 支持根据指令生成 JSON、Markdown 或指定格式内容，适用于工作流自动化与 RPA 场景。\n- **内容改写与优化**  \n  包括语法纠正\
    、风格转换、扩写、缩写、润色、翻译等。\n- **代码生成（如支持）**  \n  可生成或解释代码片段，支持常见编程语言与技术场景。\n- **信息抽取（\
    如支持）**  \n  根据文本内容提取关键词、实体、关系、事件或结构化信息。\n\n模型支持长文本上下文、大段落处理，并允许温度、最大长度、top_p 等\
    参数控制输出多样性与稳定性。大型长文本生成任务可结合异步任务接口获取结果。\n"
- name: "图像生成"
  description: "提供基于生成式 AI 的图像生成能力，支持从文本提示词、参考图片或多模态输入中自动生成高质量的图像内容。适用于创意设计、电商、广告、\
    游戏、美术、社交媒体内容生产等场景。\n\n本标签下的接口主要涵盖：\n\n- **文生图（Text-to-Image）**  \n  根据自然语言提示词生\
    成照片级、插画风、二次元、艺术风格等多类型图像，支持画面风格、构图、光影、纵横比等参数控制。\n- **图生图（Image-to-Image）**  \n\
    \  基于参考图片进行重绘、增强、风格迁移、细节修复，保持主体一致性。\n- **多风格生成与控制**  \n  支持指定艺术风格（如写实、油画、水彩、赛博\
    朋克、卡通、电商白底图等），可进行构图与视觉属性调节。\n- **高清增强 / 重绘（如支持）**  \n  支持超分辨率、局部修复、背景替换等能力。\n\
    - **一致性生成（如支持）**  \n  用于生成同一角色的多张一致形象图片，适用于虚拟人、IP 形象等场景。\n\n高分辨率、批量生成或耗时较长的任务将\
    自动使用异步任务模式，并通过异步任务接口获取生成结果。\n\n生成结果通常输出 PNG、JPEG、WebP 等格式，可附带生成元数据（prompt、种子、模\
    型版本等），方便复现与精调。\n"
- name: "图像识别"
  description: "提供基于深度学习的图像识别与光学字符识别（OCR）能力，可从图片中自动提取文字内容，并支持多语言、多版式、多场景的文本识别。\n\n\
    本标签下的接口主要聚焦 OCR 能力，包括：\n\n- **通用 OCR 识别**  \n  从自然场景图、扫描件、拍照文档、印刷体内容中提取文字，自动识别\
    段落顺序、行间结构与换行关系。\n- **多语言识别**  \n  支持中文、英文及常见多语种的文本识别，自动检测语言并输出统一结构化格式。\n- **复杂\
    版式处理**  \n  可对含表格、截图、票据、表单、广告图等复杂场景进行文本抽取。\n- **手写体识别（如支持）**  \n  识别简单或复杂的手写文本\
    ，适用于笔迹记录与表单录入场景。\n- **版面结构输出**  \n  输出文本块位置、置信度、行坐标等结构化信息，支持用于搜索、数据录入、知识库构建等系统\
    。\n\n若处理任务较大（如 PDF 批量图片解析或超大分辨率图），可使用异步任务接口获取最终 OCR 结果。\n\n本能力适用于企业文档管理、票据录入、办\
    公自动化（OA）、自媒体内容处理、知识库构建、影像系统数据抽取等多种场景。\n"
- name: "应用场景接口"
  description: "提供偏向实际业务应用，主要面向文本处理和信息获取场景，例如文本翻译。  \n- **文本翻译**  \n  对文本内容进行高质量、多\
    语言互译，支持短文本和长文本处理，适合跨语言沟通、文档翻译、消息内容翻译等场景。\n"
- name: "自动语音识别"
  description: "提供高精度的自动语音识别（ASR）能力，将语音音频内容实时或离线转写为文本。支持多语言、多场景、多说话人识别，适用于语音输入、会议记\
    录、字幕生成、客服质检、音频搜索等应用场景。\n\n本标签下的接口主要能力包括：\n\n- **实时语音识别**  \n  对直播或流式语音进行即时转写，低\
    延迟输出文本结果，适合会议、直播、呼叫中心等场景。\n- **离线语音识别**  \n  对录制的音频文件进行高精度转写，支持长音频和批量处理任务。\n-\
    \ **多语言及方言支持**  \n  自动识别多语言语音，并可选择识别特定语言或方言以提高准确率。\n- **多说话人分离（如支持）**  \n  对多人\
    语音进行分轨或标注说话人，生成分角色文本内容。\n- **时间戳标注与结构化输出**  \n  输出带时间戳的逐句文本或结构化字幕格式（如 SRT、VTT）\
    ，便于视频字幕生成和音频内容分析。\n- **音频预处理与降噪（如支持）**  \n  可对输入音频进行噪声抑制、回声消除和声道处理，提高识别质量。\n\n\
    对长音频或复杂音频内容，可结合异步任务接口处理，获取最终转写结果。该能力适用于智能客服、字幕生成、语音搜索、内容归档、知识库录入等多种业务场景。\n"
- name: "语音合成"
  description: "提供高质量的文本转语音（Text-to-Speech, TTS）能力，将输入文本合成为自然流畅的人声语音。支持多语言、多音色、多情绪\
    表达和自定义发音控制，可广泛用于智能客服、内容创作、虚拟人、教育、无障碍阅读等场景。\n\n本标签下的接口支持以下能力：\n\n- **文本转语音（TTS）\
    **  \n  根据输入文本生成语音音频，支持多种音色、语言、语速、语调和情绪（如自然、兴奋、平静、播报等）。\n- **角色音色与虚拟人配音**  \n\
    \  可选择预置音色，也可使用自定义人物音色（如系统支持）进行合成，适用于短视频与虚拟人场景。\n- **多语言与多场景播报**  \n  支持中英双语及多\
    语种朗读，适用于旁白、教学、新闻播报、广播系统等场景。\n- **长语音合成（异步模式）**  \n  对于分钟级长内容，可使用异步任务接口获取生成结果，适\
    用于小说朗读、课程音频、播客等内容制作。\n- **标注与控制（如支持）**  \n  支持断句控制、语速调节、音量控制、停顿标记、拼音强制标注等高级用法。\
    \n\n输出音频格式通常包括 MP3、WAV、OGG 等，可按需求选择。该能力可帮助开发者快速生成自然、人性化的语音内容。\n"
- name: "特征抽取"
  description: "提供文本与多模态内容的特征向量提取与语义增强能力，包括 Embedding 生成、Reranker 排序、句子相似度计算等核心语义处\
    理接口。\n\n本标签下的接口可将自然语言或其他模态内容转换为高维语义向量，用于搜索、推荐、检索增强（RAG）、聚类、分类、排序等场景。主要能力包括：\n\n\
    - **文本向量（Embedding）生成**  \n  将句子、段落或文档转化为高维语义向量，支持用于向量数据库检索、语义搜索、召回排序等任务。向量具备上\
    下文理解能力，可处理多语言内容。\n- **Reranker 重排序**  \n  在初筛结果（例如向量召回 Top-K）基础上，根据语义相关性进行高精度重\
    排序，提升最终检索效果。适用于 RAG、问答系统、智能客服等场景。\n- **句子相似度计算**  \n  计算两段文本之间的语义相似度，返回相似度分数，用\
    于查重、语义比对、内容对齐等任务。\n- **多模态特征抽取（如支持）**  \n  提取图像、音频等跨模态向量，使得不同类型内容之间可进行统一语义空间的比\
    对与检索。\n\n这些接口为构建搜索增强、知识库问答、个性化推荐、语义分析、内容去重、数据预处理等系统提供可靠的底层语义能力。\n"
- name: "视频生成"
  description: "提供基于大模型的视频生成能力，包括文生视频（Text-to-Video）与图生视频（Image-to-Video）等多种模式，支持创\
    作短视频、镜头片段、动态场景、角色动作与多镜头叙事内容。\n\n本标签下的接口可根据文本提示词、参考图像、视频片段等输入，自动生成符合创意意图的高质量视频画\
    面。主要能力包括：\n- **文生视频（Text-to-Video）**：根据文本描述生成包含人物、场景、动作、光影与镜头语言的动态视频片段。\n- **图\
    生视频（Image-to-Video）**：从单张或多张参考图片生成连续的视频序列，实现人物动态化、场景动态化或氛围扩展。\n- **多镜头生成**（如支持\
    ）：根据脚本结构生成多段连贯镜头，用于短片与广告脚本制作。\n- **视频风格化 / 动作生成**（可选能力）：支持视频风格控制、动作驱动、摄像机轨迹控制等\
    高级特性。\n\n长视频或高分辨率视频生成将自动使用异步任务模式，并通过异步任务接口获取最终视频文件。\n\n输出通常包含 MP4 / WebM 等编码格式\
    ，并可附带关键帧、故事板信息、生成元数据等辅助信息。该能力适用于短视频创作、广告制作、虚拟人场景、影视预演、游戏叙事、AIGC 内容生产等应用场景。\n"
- name: "文档处理"
  description: "提供智能文档解析与内容结构化处理能力，支持将复杂的 PDF 文档自动转换为高质量的 Markdown、结构化文本或可编辑内容格式。\n\
    \n本标签下的接口专注于文档内容的抽取、版面还原与语义理解，可处理包含文本段落、标题层级、图片、表格、公式等多种元素的 PDF 文档。主要能力包括：\n-\
    \ **PDF 转 Markdown（PDF-to-Markdown）**：自动识别文档结构、标题层级、段落分布与样式，输出清晰且适合编辑的 Markdown\
    \ 文档。\n- **表格与图片抽取**：从 PDF 中智能识别表格与图片，并在 Markdown 中以合适形式保留结构或引用。\n- **文本内容结构化\
    **：对正文、脚注、目录、引用等内容进行准确分离与还原。\n- **复杂文档支持**：适用于扫描件（OCR）、混排文档、多列布局、数学公式等场景。\n\n处\
    理耗时较长的大型文档可使用异步任务模式，通过异步任务接口获取解析结果。该能力适用于知识库构建、数据录入、自动化内容迁移、自媒体创作、企业文档管理等场景，极大\
    提升文档数字化与处理效率。\n"
- name: "3D 生成"
  description: "提供基于生成式 AI 的三维内容自动生成能力，包括 3D 模型、材质、纹理、骨骼、动画等内容的智能生成与增强。\n\n本标签下的接口\
    支持从文本、图片、草图、参考模型等输入中生成可直接用于游戏、数字人、虚拟空间、工业可视化等场景的标准化 3D 资产。典型能力包括：\n- **文本生成 3D（\
    Text-to-3D）**：从自然语言描述生成 3D 模型（如角色、场景、物体）。\n- **图像生成 3D（Image-to-3D）**：从单张或多张图片\
    快速重建 3D 模型。\n- **3D 网格与点云重建**：支持重建高保真网格、点云、体素等基础数据结构。\n- **自动生成材质 / 纹理贴图**：生成符\
    合 PBR 标准的纹理（BaseColor、Normal、Roughness 等）。\n- **3D 模型优化**：网格精简、骨骼绑定、法线修复、模型结构增\
    强等。\n- **动画生成**（若平台支持）：根据文本或示例动作生成骨骼动画。\n\n生成结果通常以 glTF、OBJ、FBX、PLY 等主流格式输出。复杂\
    模型生成支持异步任务模式，通过异步任务接口获取最终 3D 资产。\n\n这些能力适用于 AIGC 工具、游戏制作、影视特效、虚拟人、工业数字孪生、教育培训等\
    领域，帮助开发者快速构建高质量三维内容。\n"
- name: "风控识别"
  description: "提供多模态智能风控识别能力，对接入平台的文本、图片、音频、视频等内容进行安全审核与风险识别。\n\n系统基于安全大模型与规则体系，对\
    内容进行多维度评估，包括但不限于：涉政、暴恐、违禁、色情、辱骂、仇恨、广告滥用、隐私泄露、版权风险、未成年人不当内容等。\n\n本标签下的接口支持对不同类型\
    内容进行细粒度安全检查：\n- **文本风控识别**：检测违规文本、提示风险标签、给出置信度评分和风险原因。\n- **图片风控识别**：识别涉黄、暴力、敏\
    感人物、违规场景等视觉风险。\n- **音频/视频风控识别**（若平台支持）：自动转写并对语义及画面进行综合安全评估。\n- **多模态审核**：将文本、图\
    片、元信息结合判断，提高整体准确率。\n\n风控识别接口适用于内容社区、企业内审、客服质检、UGC/PGC 平台、AI 生成内容（AIGC）的安全把控等场景\
    ，帮助企业提前拦截违规内容并满足合规要求。\n"
- name: "音乐生成"
  description: "提供基于大模型的智能音乐生产能力，包括旋律生成、伴奏自动编曲、风格迁移、歌词驱动生成、人声合成以及完整音乐段落创作等功能。\n\n这\
    些接口支持从文本提示词、歌词、风格设定等输入中自动生成音乐内容，并可输出多种格式的音频文件。根据生成时长不同，接口同时支持同步与异步处理模式：  \n- **短\
    音乐片段（通常 ≤ 20 秒）**：实时生成并直接返回音频内容。  \n- **较长音乐/复杂编曲任务**：以异步任务形式执行，并通过异步任务接口查询最终结\
    果。\n\n常见能力包括：  \n- 文本到音乐（Text-to-Music）生成  \n- 自动旋律创作  \n- AI 伴奏 / 编曲  \n- 音乐风\
    格设定（如流行、古典、电子、氛围、电影配乐等）  \n- 多模态生成（如结合歌词或参考旋律生成）  \n\n本标签下的 API 面向音乐创作、短视频平台、游\
    戏音频、内容平台、虚拟人、教育和音频生产等场景，提供灵活且高质量的 AI 音乐生成能力。\n"
- name: "API 流水线"
  description: "用于定义与执行由多个步骤组成的 API 流水线（Pipeline），支持顺序执行、 并行执行、跨步骤变量传递，适用于复杂的多阶段 AI\
    \ 处理流程。\n"
- name: "异步任务"
  description: "用于创建和管理执行时间较长的任务，如视频生成、长语音生成、文档解析等。 任务在后台异步执行，客户端通过 task_id 查询任务状态\
    或等待回调通知。\n"
- name: "搜索"
  description: "给AI用的世界知识搜索引擎，它可以让你的AI应用连接世界知识，获得干净、准确、高质量的搜索结果。\n"
- name: "算力市场开放 API"
  description: "用于算力算力市场的容器创建和管理。\n"
