                          description: "当前段落转写文本"
                          example: "燃气泄漏的时间越长,设备内的基存物就受热挥发"
                        tokens:
                          type: "array"
                          items:
                            type: "integer"
                          description: "段落对应的 token ID 序列"
                          example:
