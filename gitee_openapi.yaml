                          - 24184
                          - 225
                          - 42204
                          - 6847
                        temperature:
                          type: "number"
                          format: "float"
                          description: "采样温度，控制随机性"
                          example: 0.0
                        avg_logprob:
                          type: "number"
                          format: "float"
                          description: "段落平均对数概率，越高表示模型越确定"
                          example: -0.09909108410710873
                        compression_ratio:
                          type: "number"
                          format: "float"
