  /app:
    get:
      summary: "获取应用基本信息"
      operationId: "app.getAppInfo"
      description: "用于获取应用的基本信息（包括状态和计费计划）。\n\n**鉴权规则：**\n- 应用已上架：无需鉴权。\n- 应用未上架：需\
        使用“应用专属令牌”进行鉴权,“应用专属令牌”可在工作台->设置->访问令牌获取。\n\n**返回信息说明：**\n- 应用从未上架：返回最新配置的\
        信息。\n- 应用已上架：\n  - 若请求头开启调试模式：返回最新配置的信息。\n  - 否则：返回上架时的信息。\n"
      tags:
      - "AI 应用市场接口"
      parameters:
      - $ref: "#/components/parameters/X-Dev-Mode"
      - name: "appid"
        in: "query"
        required: true
        description: "APPID，用于唯一标识应用，可在应用详情页获取。"
        schema:
          type: "string"
      responses:
        "200":
          description: "返回应用的基本信息及收费计划信息"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppInfo"
  /app/auth/vcode:
    post:
      summary: "发送验证码"
      operationId: "app.sendVerificationCode"
      description: "发送验证码，支持短信或邮箱方式，用于获取应用“用户访问令牌”的验证码。\n\n**鉴权方式：**\n  - 需使用“应用专属\
        令牌”进行鉴权,“应用专属令牌”可在工作台->设置->访问令牌获取。\n"
      tags:
      - "AI 应用市场接口"
      security:
      - AccessTokenAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: "object"
              properties:
                appid:
                  type: "string"
                  description: "｜ APPID，用于唯一标识应用，可在应用详情页获取。 当前每个应用已分配专属令牌，通常无需传递该参\
                    数。 仅在使用旧版通用令牌时需传入 APPID（旧令牌将在一个月后失效），建议尽快切换为应用专属令牌。"
                mobile:
                  type: "string"
                  description: "手机号"
                email:
                  type: "string"
                  description: "邮箱"
                channel_type:
                  $ref: "#/components/schemas/ChannelType"
      responses:
        "200":
          description: "短信验证码发送结果"
          content:
            application/json:
              schema:
                type: "boolean"
  /app/auth/token:
    post:
      summary: "获取“用户访问令牌”"
      operationId: "app.getAccessToken"
      description: "校验验证码并获取“用户访问令牌”。获取后，用户可使用该凭证下单、查看订阅信息等。\n\n**鉴权方式：**\n- 需使用“应\
        用专属令牌”进行鉴权,“应用专属令牌”可在工作台->设置->访问令牌获取。\n"
      tags:
      - "AI 应用市场接口"
      security:
      - AccessTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              required:
              - "code"
              properties:
                appid:
                  type: "string"
                  description: "｜ APPID，用于唯一标识应用，可在应用详情页获取。 当前每个应用已分配专属令牌，通常无需传递该参\
                    数。 仅在使用旧版通用令牌时需传入 APPID（旧令牌将在一个月后失效），建议尽快切换为应用专属令牌。"
                channel_type:
                  $ref: "#/components/schemas/ChannelType"
                mobile:
                  type: "string"
                  description: "手机号"
                email:
                  type: "string"
                  description: "邮箱"
                code:
                  type: "string"
                  description: "短信验证码"
      responses:
        "200":
          description: "用户访问令牌"
          content:
            application/json:
              schema:
                type: "object"
                required:
                - "access_token"
                properties:
                  access_token:
                    type: "string"
                    description: "用户访问令牌"
  /app/user:
    get:
      summary: "获取当前用户信息"
      operationId: "app.getUserInfo"
      description: "获取当前用户信息及应用订阅信息。用户购买应用后，返回应用购买的使用信息。\n\n**鉴权方式：**\n- 需使用“用户访问令\
        牌”进行鉴权,“用户访问令牌”通过获取用户访问凭证接口获取\n"
      tags:
      - "AI 应用市场接口"
      security:
      - AppAccessTokenAuth: []
      responses:
        "200":
          description: "返回用户信息及用户的订阅信息"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppUserInfo"
  /app/pay:
    post:
      summary: "支付"
      operationId: "app.pay"
      description: "用户通过本接口购买订阅应用，订阅后可使用Serverless API。系统将根据用户的订阅或充值情况，限制其对 Serverless\
        \ API 的调用权限。\n\n**鉴权方式：**\n- 需使用“用户访问令牌”进行鉴权,“用户访问令牌”通过获取用户访问凭证接口获取\n\n**有\
        效收费计划标识：**\n- 应用从未上架：使用最新配置的收费计划标识\n- 应用已上架：\n  - 若请求头开启调试模式：使用最新配置的收费计划标识\
        \n  - 否则：使用上架配置的收费计划标识。\n\n**计费模式说明：**\n支持订阅计费与按量计费，二者不互斥，可同时购买并生效。调用 Serverless\
        \ API 时，系统将优先按照按量计费方式扣费，按量余额耗尽后，自动切换为订阅计费验证。\n  - **订阅计费模式**：需提供 `quantity`\
        \ 字段，表示购买的数量。多个订阅将按购买顺序依次生效，按时间顺序生效与过期。\n  - **按量计费模式**：需提供 `amount` 字段，表示\
        实际充值金额（单位为“元”，精确到分（最小单位为0元））。充值后立即生效，调用时按购买时间优先扣费。\n"
      tags:
      - "AI 应用市场接口"
      security:
      - AppAccessTokenAuth: []
      parameters:
      - $ref: "#/components/parameters/X-Dev-Mode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              required:
              - "plan_ident"
              properties:
                plan_ident:
                  type: "string"
                  description: "应用的收费计划标识符"
                quantity:
                  type: "integer"
                  description: "购买数量，默认值为 1。仅在订阅计费模式下必填。\n"
                  default: 1
                  minimum: 1
                  maximum: 10000
                amount:
                  type: "number"
                  description: "充值金额，单位为“元”，精确到分（最小单位为0元）。仅在按量计费模式下必填，代表本次实际充值金额。\n"
                  minimum: 0
                  maximum: 10000000
                type:
                  type: "string"
                  description: "支付方式"
                  enum:
                  - "wepay"
                  - "alipay"
      responses:
        "200":
          description: "返回支付信息。当前仅支持 **二维码支付**，服务端会返回一个可用于展示二维码的链接，商户可将该链接生成二维码后引导\
            用户扫码完成支付。"
          content:
            application/json:
              schema:
                type: "object"
                required:
                - "ident"
                - "status"
                properties:
                  ident:
                    type: "string"
                    description: "支付号，用于标识本次支付请求，可用于后续查询订单状态。"
                  status:
                    $ref: "#/components/schemas/OrderStatus"
                  redirect_type:
                    type: "string"
                    description: "支付跳转方式。目前仅支持 **qrcode** 类型，即二维码支付。"
                    enum:
                    - "qrcode"
                  url:
                    type: "string"
                    description: "用于生成二维码的链接地址。商户可将该链接渲染成二维码展示给用户，用户扫码后即可跳转至支付页面。\n\
                      - 若为网页端，可直接使用二维码组件渲染此链接。\n- 若为移动端，可将链接转换为图片二维码进行展示。\n"
    get:
      summary: "获取支付详情"
      operationId: "app.getPaymentInfo"
      description: "根据支付编码获取当前用户支付详情。\n\n**鉴权方式：**\n- 需使用“用户访问令牌”进行鉴权,“用户访问令牌”通过获取\
        用户访问凭证接口获取\n"
      tags:
      - "AI 应用市场接口"
      security:
      - AppAccessTokenAuth: []
      parameters:
      - name: "ident"
        in: "query"
        required: true
        description: "支付号"
        schema:
          type: "string"
      responses:
        "200":
          description: "返回支付详情"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRecord"
