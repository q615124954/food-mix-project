components:
  securitySchemes:
    AccessTokenAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "Random"
    AppAccessTokenAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "Random"
      description: "应用用户访问令牌"
  responses:
    UnauthorizedError:
      description: "Access token is missing or invalid"
    BadRequestError:
      description: "Bad request or invalid parameters"
    ForbiddenError:
      description: "You don't have permission to access this resource"
    NotFoundError:
      description: "Resource not found or you don't have permission to access it"
    EntityTooLargeError:
      description: "Entity is too large"
    InternalServerError:
      description: "Internal server error occurred"
  parameters:
    X-Package:
      name: "X-Package"
      in: "header"
      description: "资源包服务编码"
      required: false
      schema:
        type: "string"
    TaskId:
      name: "task_id"
      in: "path"
      description: "任务id"
      required: true
      schema:
        type: "string"
    PageIndex:
      name: "page"
      in: "query"
      description: "分页号"
      required: false
      schema:
        type: "integer"
    PageSize:
      name: "size"
      in: "query"
      description: "分页大小"
      required: false
      schema:
        type: "integer"
    X-Dev-Mode:
      name: "X-Dev-Mode"
      in: "header"
      description: "是否启用开发调试模式。启用后，将使用应用的最新修改版本数据（即使未上架），\n适用于开发过程中实时查看并调试变更效果。未启用\
        时，仅使用已上架的稳定版本信息。\n⚠️ **注意：建议仅在开发环境中使用该参数，生产环境请勿设置此 Header，以避免使用非稳定版本的数据。**\n"
      required: false
      schema:
        type: "boolean"
        default: false
  schemas:
    WebSearchResponse:
      type: "object"
      description: "Web 搜索响应"
      required:
      - "query"
      - "total"
      - "results"
      - "images"
      properties:
        request_id:
          type: "string"
          description: "请求唯一标识"
        query:
          type: "string"
          description: "原始搜索内容"
        total:
          type: "integer"
          description: "匹配结果数量"
        time_cost:
          type: "integer"
          description: "搜索耗时，单位由具体搜索服务定义"
        results:
          type: "array"
          description: "网页搜索结果"
          items:
            $ref: "#/components/schemas/WebSearchResult"
        images:
          type: "array"
          description: "搜索结果中的图片"
          items:
            $ref: "#/components/schemas/WebSearchImage"
    WebSearchResult:
      type: "object"
      required:
      - "title"
      - "url"
      properties:
        id:
          type: "string"
          description: "结果标识"
        title:
          type: "string"
          description: "网页标题"
        url:
          type: "string"
          format: "uri"
          description: "网页地址"
        snippet:
          type: "string"
          description: "网页摘要片段"
        summary:
          type: "string"
          description: "搜索结果摘要，仅在请求 summary=true 时返回"
        content:
          type: "string"
          description: "网页正文"
        site_name:
          type: "string"
          description: "站点名称"
        site_icon:
          type: "string"
          description: "站点图标地址"
        published_at:
          type: "string"
          description: "网页发布时间"
