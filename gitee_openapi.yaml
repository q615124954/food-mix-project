                  type: "number"
  /rerank/multimodal:
    post:
      summary: "多模态重排接口"
      operationId: "serverless-api.openai_rerank_multimodal"
      description: "该接口用于调用 Serverless 根据查询对多模态文档列表进行语义相关度重排，返回按得分降序排列的结果。"
      tags:
      - "特征抽取"
      security:
      - AccessTokenAuth: []
      - AppAccessTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              required:
              - "query"
              - "documents"
              - "model"
              properties:
                model:
                  type: "string"
                  description: "模型名称，大小写不敏感并且支持带有命名空间，例如jina-reranker-m0。"
                  enum:
                  - "Qwen3-VL-Reranker-2B"
                  - "Qwen3-VL-Reranker-8B"
                query:
                  description: "查询文档"
                  oneOf:
                  - type: "object"
                    title: "text"
                    properties:
                      text:
                        type: "string"
                        description: "文本内容"
                    required:
                    - "text"
                  - type: "object"
                    title: "URL/Base64"
                    properties:
                      image:
                        type: "string"
                        description: "图像的 URL 或 Base64 编码的图像数据"
                    required:
                    - "image"
                documents:
                  type: "array"
                  description: "待重排的目标文档列表"
                  maxItems: 25
                  items:
                    oneOf:
                    - type: "object"
                      title: "text"
                      properties:
                        text:
                          type: "string"
                          description: "文本内容"
                      required:
                      - "text"
                    - type: "object"
                      title: "URL/Base64"
                      properties:
                        image:
                          type: "string"
                          description: "图像的 URL 或 Base64 编码的图像数据"
                      required:
                      - "image"
                return_documents:
                  type: "boolean"
                  description: "是否在响应中原样返回文档内容"
                  default: false
      responses:
        "200":
          description: "重新排序结果"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  type: "object"
                  properties:
                    index:
                      type: "integer"
                    document:
                      oneOf:
                      - type: "object"
                        title: "text"
                        properties:
                          text:
                            type: "string"
                            description: "文本内容"
                      - type: "object"
                        title: "URL/Base64"
                        properties:
                          image:
                            type: "string"
                            description: "图像的 URL 或 Base64 编码的图像数据"
                    score:
                      type: "number"
                      format: "float"
                      description: "语义相关度，范围 0–1，越高越相关"
  /rerank:
    post:
      summary: "句子重排"
      operationId: "serverless-api.openai_rerank"
      description: "该接口用于调用 Serverless 对一组候选句子与查询句的语义相关度进行打分并重新排序"
      tags:
      - "特征抽取"
      security:
      - AccessTokenAuth: []
      - AppAccessTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              title: "RerankRequestBody"
              required:
              - "query"
              - "documents"
              - "model"
              properties:
                model:
                  type: "string"
                  description: "模型名称，大小写不敏感并且支持带有命名空间，例如bge-reranker-v2-m3及BAAI/bge-reranker-v2-m3都\
                    可支持。"
                  enum:
                  - "bce-reranker-base_v1"
                  - "Qwen3-Reranker-0.6B"
                  - "Qwen3-Reranker-4B"
                  - "bge-reranker-v2-m3"
                  - "Qwen3-Reranker-8B"
                query:
                  type: "string"
                  description: "查询句"
                top_n:
                  type: "integer"
                  description: "返回得分最高的前 N 条，默认为 3"
                  default: 3
                documents:
                  type: "array"
                  description: "候选句列表"
                  items:
                    type: "string"
      responses:
