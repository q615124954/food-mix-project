                        type: "integer"
                        description: "输入文本占用的 token 数"
                  results:
                    type: "array"
                    items:
                      type: "object"
                      properties:
                        index:
                          type: "integer"
                          description: "对应原 documents 下标"
                        document:
                          type: "object"
                          description: "候选句对象"
                          properties:
                            text:
                              type: "string"
                              description: "文档内容"
                        relevance_score:
                          type: "number"
                          format: "float"
                          description: "语义相关度，范围 0–1，越高越相关"
  /moderations:
    post:
      summary: "风控识别"
      operationId: "serverless-api.openai_moderation"
      description: "该接口用于检查文本或图像是否可能有害，需要使用 Access Token 进行授权。"
      tags:
      - "风控识别"
      security:
      - AccessTokenAuth: []
      - AppAccessTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              title: "OpenAIModerationRequestBody"
              required:
              - "model"
              - "input"
              properties:
                model:
                  type: "string"
                  description: "模型名称，大小写不敏感并且支持带有命名空间，例如nsfw-classifier及giacomoarienti/nsfw-classifier都\
                    可支持。"
                  enum:
                  - "moark-text-moderation"
                  - "Security-semantic-filtering"
                  - "nonescape-v0"
                  - "nsfw-classifier"
                input:
                  oneOf:
                  - type: "string"
                    description: "输入语句"
                  - type: "array"
                    description: "多模态输入参数列表"
                    items:
                      type: "object"
                      oneOf:
                      - type: "string"
                        title: "string"
                        description: "需要审核的文本字符串。"
                      - type: "object"
                        title: "text"
                        properties:
                          type:
                            type: "string"
                            enum:
                            - "text"
                          text:
                            type: "string"
                            description: "需要审核的文本字符串。"
                      - type: "object"
                        title: "image_url"
                        properties:
                          type:
                            type: "string"
                            enum:
                            - "image_url"
                          image_url:
                            type: "object"
                            description: "图像的 URL 或 Base64 编码的图像数据。"
                            properties:
                              url:
                                type: "string"
                                description: "图像的 URL 或 Base64 编码的图像数据"
      responses:
        "200":
          description: "风控识别结果"
          content:
            application/json:
              schema:
                type: "object"
                title: "OpenAIModerationResponse"
                properties:
                  id:
                    type: "string"
                    description: "本次请求唯一标识符，用于追踪与审计"
                  model:
                    type: "string"
                    description: "实际执行的审核模型名称"
                  results:
                    type: "array"
                    items:
                      type: "object"
                      properties:
                        flagged:
                          type: "boolean"
                          description: "是否触发任一审核规则；true 表示存在风险"
                        categories:
                          type: "object"
                          description: "按风险类别给出布尔标记，键为类别名，值为是否命中"
                        category_scores:
                          type: "object"
                          description: "各类别的置信度分数，范围 0–1，越高越可疑"
                        category_applied_input_types:
                          type: "object"
                          description: "触发各类别时对应的输入类型"
  /web-search:
    post:
      description: "从近百亿网页和生态内容源中搜索高质量世界知识，例如新闻、图片、百科、文库等。"
      tags:
      - "搜索"
      security:
      - AccessTokenAuth: []
      - AppAccessTokenAuth: []
      operationId: "serverless-api.web_search"
      requestBody:
        description: "请求参数"
        content:
          application/json:
            schema:
              type: "object"
              properties:
                query:
                  type: "string"
                  description: "搜索关键字或语句"
                  example: "阿里巴巴2024年的ESG报告"
                summary:
                  type: "boolean"
                  description: "是否在搜索结果中包含摘要"
                  example: true
                freshness:
                  type: "string"
                  description: "已兼容保留但不再生效；无论传入 \"noLimit\"、\"oneDay\"、\"oneWeek\"\
                    、\"oneMonth\" 或 \"oneYear\"，都是一样的效果。"
                  default: "noLimit"
                  enum:
                  - "noLimit"
                  - "oneDay"
                  - "oneWeek"
                  - "oneMonth"
                  - "oneYear"
                  example: "noLimit"
                search_recency_filter:
                  type: "string"
                  description: "根据网页发布时间进行筛选；可替代已不生效的 freshness 参数。"
                  enum:
                  - "week"
                  - "month"
                  - "semiyear"
                  - "year"
                  example: "week"
                search_site_filter:
                  type: "array"
                  description: "指定站点搜索条件，仅在设置的站点中进行内容搜索；内部会转换为百度 search_filter.match.site。\
                    当前最多支持 100 个站点。"
                  items:
                    type: "string"
                  example:
                  - "tieba.baidu.com"
                  - "baike.baidu.com"
                count:
                  type: "integer"
                  description: "返回的搜索结果数量（1-8），默认为8"
                  default: 10
                  minimum: 1
                  maximum: 50
                  example: 10
              required:
              - "query"
      responses:
        "200":
          description: "成功的搜索响应"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  code:
                    type: "integer"
                    description: "响应的状态码"
                    example: 200
                  msg:
                    type: "string"
                    nullable: true
                    description: "请求的消息提示（如果有的话）"
                    example: null
                  data:
                    type: "object"
                    properties:
                      _type:
                        type: "string"
                        description: "搜索的类型"
                        example: "SearchResponse"
                      queryContext:
                        type: "object"
                        properties:
                          originalQuery:
                            type: "string"
                            description: "原始的搜索关键字"
                            example: "阿里巴巴2024年的ESG报告"
                      webPages:
                        type: "object"
                        properties:
                          webSearchUrl:
                            type: "string"
                            description: "网页搜索的URL"
                            example: "https://bochaai.com/search?q=阿里巴巴2024年的ESG报告"
                          totalEstimatedMatches:
                            type: "integer"
                            description: "搜索匹配的网页总数"
                            example: 1618000
                          value:
                            type: "array"
                            items:
                              type: "object"
                              properties:
                                id:
                                  type: "string"
                                  nullable: true
                                  description: "网页的排序ID"
                                name:
                                  type: "string"
                                  description: "网页的标题"
                                url:
                                  type: "string"
                                  description: "网页的URL"
                                displayUrl:
                                  type: "string"
                                  description: "网页的展示URL"
                                snippet:
                                  type: "string"
                                  description: "网页内容的简短描述"
                                summary:
                                  type: "string"
                                  description: "网页内容的文本摘要"
                                siteName:
                                  type: "string"
                                  description: "网页的网站名称"
                                siteIcon:
                                  type: "string"
                                  description: "网页的网站图标"
                                datePublished:
                                  type: "string"
                                  format: "date-time"
                                  description: "网页的发布时间"
                                dateLastCrawled:
                                  type: "string"
                                  format: "date-time"
                                  description: "网页的收录时间或发布时间"
                                cachedPageUrl:
                                  type: "string"
                                  nullable: true
                                  description: "网页的缓存页面URL"
