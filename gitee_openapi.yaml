  /tokens/temporary:
    post:
      summary: "创建临时访问令牌"
      description: "该接口用于生成短期有效的临时访问令牌，适用于临时鉴权场景（如一次性数据访问、限时操作）。生成的 Token 有效期可控（5-3600\
        \ 秒），避免长期 Token 暴露风险，提升安全性。生成后可在有效期内用于访问需鉴权的接口（如携带 `Authorization:Bearer {token}`\
        \ 请求头）"
      operationId: "token.createTemporaryToken"
      tags:
      - "AI 应用市场接口"
      security:
      - AccessTokenAuth: []
      requestBody:
        required: true
        description: "请求体需包含临时 Token 的有效时长（秒），**必须满足 5 ≤ seconds ≤ 3600**（太短可能无法完成\
          操作，太长增加安全风险），超出范围返回 `400 错误"
        content:
          application/json:
            schema:
              type: "object"
              properties:
                seconds:
                  type: "integer"
                  description: "临时 Token 的有效时间，**推荐设置为业务所需的最小必要时长**（如 300 秒用于单次操作）\
                    ，单位：秒，范围：5~3600"
                  default: 3600
                  minimum: 5
                  maximum: 3600
                usage_limit:
                  type: "number"
                  nullable: true
                  minimum: 0
                  exclusiveMinimum: true
                  description: "临时 Token 限制额度（元），为空表示不限制，非空时必须大于0"
      responses:
        "200":
          description: "创建成功后返回的 Token 详情，包含 Token 字符串和过期时间。**Token 使用方式**：在后续请求头中\
            添加 `Authorization:Bearer {token}`，过期后自动失效（无需主动销毁）"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  token:
                    type: "string"
                    description: "临时访问令牌，格式为服务端生成的唯一字符串（如 JWT 或随机 UUID），**请勿泄露该 Token**，\
                      有效期内具有鉴权能力。"
                  expired_at:
                    type: "string"
                    format: "date-time"
                    description: "Token 失效时间，遵循 **ISO 8601 格式**（如 `2025-07-08T12:34:56.789Z`）\
                      ，过期后任何携带该 Token 的请求将被拒绝。"
                  usage_limit:
                    type: "number"
                    nullable: true
                    minimum: 0
                    exclusiveMinimum: true
                    description: "临时 Token 限制额度（元）"
                  used_amount:
                    type: "number"
                    description: "临时 Token 已使用额度（元）"
  /tokens/temporary/status:
    put:
      summary: "更新临时访问令牌状态"
