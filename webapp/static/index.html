<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>采购单审核工作台</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", sans-serif; background: #f5f6f8; color: #222; display: flex; height: 100vh; }
  /* 侧栏 */
  .sidebar { width: 260px; background: #fff; border-right: 1px solid #e5e7eb; display: flex; flex-direction: column; }
  .sidebar h2 { font-size: 15px; padding: 14px 16px; border-bottom: 1px solid #eee; }
  .progress { padding: 10px 16px; font-size: 12px; color: #666; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; }
  .list { flex: 1; overflow-y: auto; }
  .paths { padding: 10px 16px; border-bottom: 1px solid #eee; font-size: 12px; }
  .paths label { display: block; margin-bottom: 6px; color: #555; }
  .paths input { width: 100%; padding: 5px 7px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 12px; box-sizing: border-box; }
  .paths button { margin-top: 6px; width: 100%; padding: 5px 0; border: none; border-radius: 5px; background: #6b7280; color: #fff; font-size: 12px; cursor: pointer; }
  .paths .pathrow { display: flex; gap: 6px; margin-bottom: 8px; align-items: center; }
  .paths .pathrow input { flex: 1; margin: 0; }
  .paths .pathrow .pick { margin: 0; width: auto; flex-shrink: 0; padding: 5px 10px; border-radius: 4px; }
  .item { padding: 10px 16px; border-bottom: 1px solid #f3f4f6; cursor: pointer; }
  .item:hover { background: #f9fafb; }
  .item.active { background: #eef4ff; border-left: 3px solid #2563eb; }
  .item .name { font-size: 13px; word-break: break-all; }
  .item .meta { font-size: 11px; color: #999; margin-top: 4px; display: flex; gap: 6px; align-items: center; }
  .badge { font-size: 11px; padding: 1px 7px; border-radius: 9px; color: #fff; }
  .b-ocr { background: #f59e0b; }
  .b-pending { background: #3b82f6; }
  .b-done { background: #10b981; }
  .b-err { background: #ef4444; }
  .b-suspect { background: #f97316; }
  /* 主区 */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .toolbar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: #fff; border-bottom: 1px solid #e5e7eb; flex-wrap: wrap; }
  .toolbar label { font-size: 13px; color: #444; }
  .toolbar input, .toolbar select { padding: 5px 8px; border: 1px solid #d1d5db; border-radius: 5px; font-size: 13px; }
  .toolbar button { padding: 6px 16px; border: none; border-radius: 5px; background: #2563eb; color: #fff; font-size: 13px; cursor: pointer; }
  .toolbar button.green { background: #10b981; }
  .toolbar button.gray { background: #6b7280; }
  .toolbar button.red { background: #ef4444; }
  .toolbar button:disabled { opacity: .5; cursor: not-allowed; }
  .content { flex: 1; display: flex; overflow: hidden; }
  .img-panel { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; background: #e9eaee; overflow: auto; padding: 12px; }
  .img-panel img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,.15); cursor: zoom-in; }
  .table-panel { width: 460px; border-left: 1px solid #e5e7eb; background: #fff; display: flex; flex-direction: column; }
  .table-panel .head { padding: 10px 14px; font-size: 13px; font-weight: 600; border-bottom: 1px solid #eee; }
  .table-wrap { flex: 1; overflow: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { border-bottom: 1px solid #f0f0f0; padding: 4px 6px; text-align: left; }
  th { background: #f9fafb; color: #555; font-weight: 600; position: sticky; top: 0; }
  td input { width: 100%; border: 1px solid transparent; padding: 4px; font-size: 13px; border-radius: 3px; }
  td input:hover { border-color: #d1d5db; }
  td input:focus { border-color: #2563eb; outline: none; background: #fff; }
  td input.ro { background: #f3f4f6; }
  td select { width: 100%; border: 1px solid transparent; padding: 3px; font-size: 13px; border-radius: 3px; background: transparent; cursor: pointer; }
  td select:hover { border-color: #d1d5db; }
  td select:focus { border-color: #2563eb; outline: none; background: #fff; }
  .cell { display: flex; align-items: center; }
  .cell input { flex: 1; min-width: 0; }
  .tag-staff { font-size: 11px; padding: 0 5px; margin-left: 3px; border-radius: 4px; background: #f59e0b; color: #fff; flex-shrink: 0; cursor: help; white-space: nowrap; }
  .tag-staff.confirm { background: #ef4444; }
  .field-warn { color: #ef4444; font-weight: bold; margin-left: 3px; flex-shrink: 0; cursor: help; }
  .empty { padding: 30px; text-align: center; color: #999; font-size: 13px; }
  .totalbar { padding: 10px 14px; font-size: 15px; font-weight: 600; border-top: 1px solid #eee; }
  .totalbar .val { color: #2563eb; }
  .totalbar .paid { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 14px; font-weight: 600; }
  .totalbar .paid input { width: 120px; border: 1px solid #d1d5db; border-radius: 4px; padding: 4px 6px; font-size: 14px; font-weight: 600; }
  .totalbar .paid input:focus { border-color: #2563eb; outline: none; }
  .paid-hint { font-size: 12px; font-weight: 400; color: #f59e0b; margin-left: 2px; }
  .paid-hint.bad { color: #ef4444; }
  .hint { padding: 8px 14px; font-size: 12px; color: #999; border-top: 1px solid #eee; }
  .toast { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%); background: #111; color: #fff; padding: 9px 18px; border-radius: 6px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 999; }
  .toast.show { opacity: 1; }
  .toast.err { background: #dc2626; }
  .sync-panel { position: fixed; right: 16px; bottom: 16px; width: 520px; max-width: 90vw; max-height: 62vh; background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.18); display: none; flex-direction: column; z-index: 1000; overflow: hidden; }
  .sync-panel.show { display: flex; }
  .sync-panel .head { padding: 10px 14px; font-weight: 600; font-size: 13px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
  .sync-panel .head button { border: none; background: #6b7280; color: #fff; padding: 3px 12px; border-radius: 5px; font-size: 12px; cursor: pointer; }
  .sync-panel .meta { padding: 6px 10px; font-size: 12px; color: #666; border-bottom: 1px solid #f0f0f0; flex-shrink: 0; word-break: break-all; }
  .sync-panel .body { overflow: auto; flex: 1; }
  .sync-panel table { width: 100%; font-size: 12px; border-collapse: collapse; }
  .sync-panel th, .sync-panel td { padding: 5px 8px; border-bottom: 1px solid #f0f0f0; text-align: left; vertical-align: top; }
  .sync-panel th { background: #f9fafb; color: #555; position: sticky; top: 0; }
  .sync-panel .ok { color: #10b981; font-weight: 600; }
  .sync-panel .warn { color: #f59e0b; font-weight: 600; }
  .sync-panel .err { color: #ef4444; font-weight: 600; }
</style>
</head>
<body>
  <div class="sidebar">
    <h2>采购单列表</h2>
    <div class="paths">
      <label>采购单文件夹</label>
      <div class="pathrow">
        <input type="text" id="fld-input-dir" placeholder="D:\采购单">
        <button type="button" class="gray pick" data-target="fld-input-dir" data-kind="dir">浏览</button>
      </div>
      <label>财务表文件夹</label>
      <div class="pathrow">
        <input type="text" id="fld-output-dir" placeholder="D:\财务表">
        <button type="button" class="gray pick" data-target="fld-output-dir" data-kind="dir">浏览</button>
      </div>
      <label>物料明细表</label>
      <div class="pathrow">
        <input type="text" id="fld-material-file" placeholder="D:\物料明细\2026年8月物料采购明细(金茂).xlsx">
        <button type="button" class="gray pick" data-target="fld-material-file" data-kind="file">浏览</button>
      </div>
      <button type="button" class="gray" id="btn-apply-paths">应用路径</button>
    </div>
    <div class="progress"><span>进度</span><span id="summary"></span></div>
    <div class="list" id="list"></div>
  </div>

  <div class="main">
    <div class="toolbar">
      <button type="button" class="gray" id="btn-prev">上一张</button>
      <button type="button" class="gray" id="btn-next">下一张</button>
      <label>日期 <input type="date" id="fld-date"><span id="date-warn" class="field-warn" style="display:none" title="日期未识别">❗</span></label>
      <label>类别 <select id="fld-category"><option value="">请选择</option><option value="蔬菜">蔬菜</option><option value="肉类">肉类</option></select><span id="category-warn" class="field-warn" style="display:none" title="该单据没有保存类别，请手动选择。不会默认成蔬菜。">❗</span></label>
      <button type="button" class="green" id="btn-confirm">确认落地</button>
      <button type="button" class="green" id="btn-sync">同步到物料明细</button>
      <button type="button" class="gray" id="btn-rescan">重新扫描</button>
      <button type="button" class="gray" id="btn-reset">重置</button>
    </div>
    <div class="content">
      <div class="img-panel" id="img-panel"><div class="empty">加载中…</div></div>
      <div class="table-panel">
        <div class="head" id="tbl-title">明细</div>
        <div class="table-wrap">
          <table>
            <thead><tr><th style="width:32%">品名</th><th style="width:22%">数量</th><th style="width:22%">单价</th><th style="width:24%">金额</th></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <div class="totalbar">
          <div>合计：¥<span class="val" id="total-val">0.00</span></div>
          <div class="paid">实付总额(优惠后) ¥<input id="fld-paid" type="number" step="0.01" min="0" placeholder="默认=明细合计"><span class="paid-hint" id="paid-hint"></span></div>
        </div>
        <div class="hint">修改数量或金额时，单价自动 = 金额 ÷ 数量；也可直接改单价。<button type="button" class="gray" id="btn-add-staff">＋补录员工餐行</button></div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <div class="sync-panel" id="sync-panel">
    <div class="head"><span>同步结果</span><button type="button" id="btn-close-sync">关闭</button></div>
    <div class="meta" id="sync-meta"></div>
    <div class="body" id="sync-body"></div>
  </div>

<script>
let state = { invoices: [] };
let cur = -1;
let lastJson = '';
let dirty = false;   // 有未提交的编辑时置 true，暂停自动刷新以免覆盖用户修改

async function refresh() {
  // 有未提交编辑时直接跳过，避免把用户改的内容还原成 OCR 原值
  if (dirty) return;
  const ae = document.activeElement;
  if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'SELECT')) return;
  const r = await fetch('/api/state');
  const data = await r.json();
  // 数据无变化则跳过重渲染，消除图片闪烁
  const j = JSON.stringify(data);
  if (j === lastJson) return;
  lastJson = j;
  state = data;
  if (cur < 0 && state.invoices.length > 0) cur = 0;
  renderPaths(data.paths);
  renderSummary();
  renderList();
  renderCurrent();
}

function renderPaths(p) {
  if (!p) return;
  document.getElementById('fld-input-dir').value = p.input_dir || '';
  document.getElementById('fld-output-dir').value = p.output_dir || '';
  document.getElementById('fld-material-file').value = p.material_file || '';
}

function selectInvoice(i) {
  dirty = false;   // 切换票据时放弃当前未保存的刷新保护
  cur = i;
  renderList();
  renderCurrent();
}

function renderSummary() {
  const s = state.summary || {};
  document.getElementById('summary').textContent =
    `识别 ${s.ocr_done||0}/${s.total||0} · 已确认 ${s.confirmed||0}`;
}

function suspectBadge(inv) {
  const s = inv.suspects || [];
  if (!s.length) return '';
  return `<span class="badge b-suspect" title="${esc(s.join('；'))}">存疑</span>`;
}

function renderList() {
  const el = document.getElementById('list');
  el.innerHTML = '';
  state.invoices.forEach((inv, i) => {
    const d = document.createElement('div');
    d.className = 'item' + (i === cur ? ' active' : '');
    let badge, bt;
    if (inv.error) { badge = '失败'; bt = 'b-err'; }
    else if (inv.status === 'confirmed') { badge = '已确认'; bt = 'b-done'; }
    else if (inv.ocr_done) { badge = '待确认'; bt = 'b-pending'; }
    else { badge = '识别中'; bt = 'b-ocr'; }
    d.innerHTML = `<div class="name">${inv.filename}</div>
      <div class="meta"><span class="badge ${bt}">${badge}</span>${suspectBadge(inv)}
      <span>${inv.date || '未取日期'}</span></div>`;
    d.onclick = () => selectInvoice(i);
    el.appendChild(d);
  });
}

function renderCurrent() {
  if (cur < 0 || cur >= state.invoices.length) {
    document.getElementById('img-panel').innerHTML = '<div class="empty">暂无票据</div>';
    document.getElementById('tbody').innerHTML = '';
    return;
  }
  const inv = state.invoices[cur];
  document.getElementById('fld-date').value = inv.date || '';
  const dw = document.getElementById('date-warn');
  if (dw) dw.style.display = inv.date ? 'none' : 'inline';
  // 确认后用保存的类别；未确认时显示明细上识别出的类别。都没有则留空并提示，不默认蔬菜。
  const itemCat = inv.items && inv.items[0] && inv.items[0]['类别'];
  const rawCat = String(inv.category || itemCat || '').trim();
  const catSel = document.getElementById('fld-category');
  catSel.value = rawCat;
  if (catSel.value !== rawCat) catSel.value = '';
  const cw = document.getElementById('category-warn');
  if (cw) cw.style.display = catSel.value ? 'none' : 'inline';
  const paidInp = document.getElementById('fld-paid');
  if (paidInp) {
    const v = inv.paid_total != null ? inv.paid_total : inv.order_total;
    paidInp.value = (v != null && v !== '') ? v : '';
  }
  recomputeTotal();
  document.getElementById('tbl-title').textContent = inv.filename;
  document.getElementById('btn-confirm').disabled = !inv.ocr_done;

  const panel = document.getElementById('img-panel');
  panel.innerHTML = `<img src="/images/${encodeURIComponent(inv.filename)}" onclick="this.style.cursor='zoom-out';this.style.maxWidth='none';this.style.maxHeight='none'" title="点击放大/还原">`;

  const tb = document.getElementById('tbody');
  tb.innerHTML = '';
  if (!inv.items || inv.items.length === 0) {
    let msg;
    if (inv.error) msg = inv.error;
    else if (inv.ocr_done) msg = '未识别到内容';
    else msg = '识别中…';
    tb.innerHTML = `<tr><td colspan="4" class="empty" style="text-align:center">${msg}</td></tr>`;
    return;
  }
  inv.items.forEach((it, idx) => {
    const tr = document.createElement('tr');
    const warn = (flag, tip) => flag ? `<span class="field-warn" title="${tip}">❗</span>` : '';
    const staffTag = it['归属'] === '员工餐'
      ? `<span class="tag-staff${it['归属待确认'] ? ' confirm' : ''}" title="${esc((it['归属依据'] || '员工餐') + (it['归属待确认'] ? '，请人工确认' : ''))}">员工餐${it['归属待确认'] ? '?' : ''}</span>` : '';
    tr.innerHTML = `
      <td><div class="cell"><input data-k="品名" data-row="${idx}" value="${esc(it['品名'] || '')}">${staffTag}${warn(it['品名存疑'], it['建议品名'] ? esc('建议改为：' + it['建议品名'] + '（请人工确认）') : '品名可能不准确')}</div></td>
      <td><div class="cell"><input data-k="数量" data-row="${idx}" data-trigger="true" value="${esc(it['数量'] != null ? it['数量'] : '')}">${warn(it['数量存疑'], esc(it['存疑说明'] || '数量缺失或为0'))}</div></td>
      <td><div class="cell"><input data-k="单价" data-row="${idx}" value="${esc(it['单价'] != null ? it['单价'] : '')}"></div></td>
      <td><div class="cell"><input data-k="金额" data-row="${idx}" data-trigger="true" value="${esc(it['金额'] != null ? it['金额'] : '')}">${warn(it['金额存疑'], esc(it['存疑说明'] || '金额缺失'))}</div></td>`;
    tr.querySelectorAll('input').forEach(inp => {
      inp.addEventListener('input', () => {
        dirty = true;
        const row = +inp.dataset.row;
        if (inp.dataset.k === '品名') { inv.items[row]['品名'] = inp.value; inv.items[row]['品名编辑'] = true; }
        else if (inp.dataset.k === '数量') inv.items[row]['数量'] = toNum(inp.value);
        else if (inp.dataset.k === '单价') inv.items[row]['单价'] = toNum(inp.value);
        else if (inp.dataset.k === '金额') inv.items[row]['金额'] = toNum(inp.value);
        if (inp.dataset.trigger) recompute(row);
      });
    });
    tb.appendChild(tr);
  });
}

document.getElementById('fld-date').addEventListener('input', () => { dirty = true; });
document.getElementById('fld-category').addEventListener('change', () => {
  dirty = true;
  const cw = document.getElementById('category-warn');
  if (cw) cw.style.display = document.getElementById('fld-category').value ? 'none' : 'inline';
});
document.getElementById('fld-paid').addEventListener('input', () => { dirty = true; updatePaidHint(); });

// 员工区漏识别时人工补录：新增一行，标记在员工区（确认时按员工餐计，不写日物料）
document.getElementById('btn-add-staff').addEventListener('click', () => {
  const inv = state.invoices[cur];
  if (!inv || !inv.ocr_done) return;
  inv.items = inv.items || [];
  inv.items.push({ '品名': '', '原品名': '', '品名编辑': true, '数量': null, '单价': null, '金额': null,
                   '员工区': true, '人工补录': true, '归属': '员工餐', '归属依据': '人工补录（员工区）' });
  dirty = true;
  renderCurrent();
});

function recompute(row) {
  const it = state.invoices[cur].items[row];
  const q = it['数量'], a = it['金额'];
  if (q && a) {
    it['单价'] = Math.round((a / q) * 100) / 100;
    const inp = document.querySelector(`input[data-k="单价"][data-row="${row}"]`);
    if (inp) inp.value = it['单价'];
  }
  recomputeTotal();
}

function currentSum() {
  const inv = state.invoices[cur];
  let sum = 0;
  if (inv && inv.items && inv.items.length > 0) {
    inv.items.forEach(it => {
      const v = typeof it['金额'] === 'number' ? it['金额'] : parseFloat(it['金额']);
      if (!isNaN(v)) sum += v;
    });
  }
  return Math.round(sum * 100) / 100;
}

function recomputeTotal() {
  const el = document.getElementById('total-val');
  if (el) el.textContent = currentSum().toFixed(2);
  updatePaidHint();
}

function paidValue() {
  const el = document.getElementById('fld-paid');
  if (!el) return null;
  const v = el.value;
  if (v === '' || v == null) return null;
  const n = parseFloat(v);
  return isNaN(n) ? null : n;
}

function updatePaidHint() {
  const el = document.getElementById('paid-hint');
  if (!el) return;
  const paid = paidValue();
  if (paid == null) { el.textContent = ''; el.className = 'paid-hint'; return; }
  const sum = currentSum();
  const diff = Math.round((sum - paid) * 100) / 100;
  if (diff > 0.005) {
    el.textContent = '优惠 ¥' + diff.toFixed(2);
    el.className = 'paid-hint';
  } else if (diff < -0.005) {
    el.textContent = '实付高于明细 ¥' + Math.abs(diff).toFixed(2);
    el.className = 'paid-hint bad';
  } else {
    el.textContent = '无优惠';
    el.className = 'paid-hint';
  }
}

function toNum(v) {
  if (v === '' || v == null) return null;
  const n = parseFloat(v);
  return isNaN(n) ? v : n;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function prev() { if (cur > 0) selectInvoice(cur - 1); }
function next() { if (cur < state.invoices.length - 1) selectInvoice(cur + 1); }

let toastTimer = null;
function toast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = 'toast'; }, 2200);
}

async function submitConfirm() {
  const inv = state.invoices[cur];
  if (!inv) return;
  const category = document.getElementById('fld-category').value;
  if (!category) {
    toast('请先选择类别（不会默认成蔬菜）', true);
    return;
  }
  const payload = {
    date: document.getElementById('fld-date').value.trim(),
    category: category,
    paid_total: paidValue(),
    items: inv.items.map(it => ({ '品名': it['品名'], '原品名': it['原品名'], '品名编辑': it['品名编辑'], '数量': it['数量'], '单价': it['单价'], '金额': it['金额'], '员工区': !!it['员工区'], '人工补录': !!it['人工补录'] }))
  };
  try {
    const r = await fetch(`/api/invoice/${encodeURIComponent(inv.filename)}/confirm`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
    });
    if (r.ok) { dirty = false; toast('已落地'); await refresh(); }
    else { const e = await r.json(); toast('落地失败：' + (e.detail || '未知错误'), true); }
  } catch (err) {
    toast('请求失败：' + err.message, true);
  }
}

async function rescan() {
  await fetch('/api/rescan', { method: 'POST' });
  dirty = false;
  lastJson = '';
  toast('已触发重新扫描，等待 OCR 完成');
  refresh();
}

let resetArmed = false;
async function doReset() {
  const btn = document.getElementById('btn-reset');
  if (!resetArmed) {
    resetArmed = true;
    btn.textContent = '再次点击确认';
    btn.classList.remove('gray');
    btn.classList.add('red');
    setTimeout(() => { resetArmed = false; btn.textContent = '重置'; btn.classList.remove('red'); btn.classList.add('gray'); }, 3000);
    toast('重置会清空已确认状态并重新识别（落地文件保留），再次点击确认');
    return;
  }
  resetArmed = false;
  btn.textContent = '重置';
  btn.classList.remove('red');
  btn.classList.add('gray');
  await fetch('/api/reset', { method: 'POST' });
  dirty = false;
  cur = -1;
  lastJson = '';
  toast('已重置，重新识别中');
  await refresh();
}

async function applyPaths() {
  const payload = {
    input_dir: document.getElementById('fld-input-dir').value.trim(),
    output_dir: document.getElementById('fld-output-dir').value.trim(),
    material_file: document.getElementById('fld-material-file').value.trim(),
  };
  try {
    const r = await fetch('/api/paths', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
    });
    if (r.ok) {
      dirty = false; cur = -1; lastJson = '';
      toast('路径已应用，正在重新扫描');
      await refresh();
    } else {
      const e = await r.json();
      toast('应用失败：' + (e.detail || '未知错误'), true);
    }
  } catch (err) {
    toast('请求失败：' + err.message, true);
  }
}

async function doSync() {
  const btn = document.getElementById('btn-sync');
  btn.disabled = true;
  btn.textContent = '同步中…';
  try {
    const r = await fetch('/api/sync', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: 'DeepSeek-V4-Pro' })
    });
    const data = await r.json();
    if (r.ok) {
      renderSyncResult(data);
      toast('已同步 ' + data.count + ' 条');
    } else {
      toast('同步失败：' + (data.detail || '未知错误'), true);
    }
  } catch (err) {
    toast('请求失败：' + err.message, true);
  } finally {
    btn.disabled = false;
    btn.textContent = '同步到物料明细';
  }
}

function renderSyncResult(data) {
  const rows = (data.results || []).map(it => {
    let cls = 'ok', conf = it['置信度'];
    if (conf == null) conf = '';
    if (it['来源'] === 'error' || it['来源'] === 'ai_error' || it['来源'] === 'ai_invalid') cls = 'err';
    else if (conf < 0.9) cls = 'warn';
    return '<tr><td>' + esc(it['日期'] || '') + '</td><td>' + esc(it['落地品名']) +
      '</td><td>' + esc(it['目标品名'] || '') + '</td><td class="' + cls + '">' + conf +
      '</td><td>' + esc(it['理由'] || '') + '</td></tr>';
  }).join('');
  document.getElementById('sync-meta').textContent =
    '共 ' + data.count + ' 条 · 备份：' + (data.backup || '');
  document.getElementById('sync-body').innerHTML =
    '<table><thead><tr><th>日期</th><th>落地品名</th><th>目标品名</th><th>置信度</th><th>理由</th></tr></thead><tbody>' + rows + '</tbody></table>';
  document.getElementById('sync-panel').classList.add('show');
}

document.getElementById('btn-prev').addEventListener('click', prev);
document.getElementById('btn-next').addEventListener('click', next);
document.getElementById('btn-confirm').addEventListener('click', submitConfirm);
document.getElementById('btn-rescan').addEventListener('click', rescan);
document.getElementById('btn-reset').addEventListener('click', doReset);

document.querySelectorAll('.pick').forEach(btn => {
  btn.addEventListener('click', async () => {
    const input = document.getElementById(btn.dataset.target);
    const initial = input ? input.value.trim() : '';
    try {
      const r = await fetch('/api/pick?kind=' + btn.dataset.kind + '&initial=' + encodeURIComponent(initial));
      const data = await r.json();
      if (r.ok && data.path) input.value = data.path;
    } catch (err) {
      toast('打开选择器失败：' + err.message, true);
    }
  });
});
document.getElementById('btn-apply-paths').addEventListener('click', applyPaths);
document.getElementById('btn-sync').addEventListener('click', doSync);
document.getElementById('btn-close-sync').addEventListener('click', () => {
  document.getElementById('sync-panel').classList.remove('show');
});

// 每次加载/刷新页面：扫描文件夹（保留已确认状态，仅补 OCR 新图片/未识别项）
async function init() {
  await fetch('/api/rescan', { method: 'POST' });
  lastJson = '';
  dirty = false;
  await refresh();
}
init();
setInterval(refresh, 3000);
</script>
</body>
</html>
